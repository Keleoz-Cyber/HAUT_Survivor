services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: haut_survivor
      MYSQL_USER: haut
      MYSQL_PASSWORD: haut123456
    # ports: "3306:3306" — omitted to avoid conflict with local MySQL; app uses Docker internal network
    volumes:
      - haut-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/haut_survivor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: haut
      SPRING_DATASOURCE_PASSWORD: haut123456
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  haut-mysql-data:
