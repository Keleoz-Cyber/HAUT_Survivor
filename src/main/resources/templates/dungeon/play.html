<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>关卡挑战 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="game-shell">

<!-- 游戏HUD -->
<div th:replace="~{fragments/layout :: game-hud}"></div>

<main class="vn-stage scene-lab">
    <div class="vn-scene">

        <!-- 场景标签 -->
        <div class="vn-scene__meta">
            <span th:text="${dungeon.dungeonName}">副本</span>
            <span th:text="|阶段 ${task.taskOrder}|">阶段</span>
            <span th:if="${task.timerSeconds}" th:text="|⏱ ${task.timerSeconds}s|">倒计时</span>
        </div>

        <!-- 任务标题 -->
        <h1 class="vn-scene__title" th:text="${task.taskName}">阶段任务</h1>

        <!-- 情境文字 -->
        <p class="vn-scene__story" th:text="${task.sceneText}">情境</p>

        <!-- 目标提示 -->
        <div class="challenge-target" th:text="${task.targetText}">目标</div>

        <!-- 数据库拼图：表名展示板 -->
        <div class="minigame-board" th:if="${isMinigameTask}">
            <p>数据库拼图</p>
            <div>
                <span>user</span>
                <span>player_attribute</span>
                <span>event</span>
                <span>event_option</span>
                <span>dungeon_task</span>
            </div>
        </div>

        <!-- Bug 定位：题面展示板 -->
        <div class="minigame-board" th:if="${isBugHuntTask}">
            <p>Bug 定位挑战</p>
            <div>
                <span>404</span>
                <span>NullPointerException</span>
                <span>Mapper 注入失败</span>
                <span>端口占用</span>
                <span>数据不更新</span>
            </div>
        </div>

        <!-- 角色状态小条 -->
        <div class="vn-scene__status">
            <div class="vn-scene__stat"><span>🔧 技能</span><strong th:text="${attribute.skill}">40</strong></div>
            <div class="vn-scene__stat vn-scene__stat--pressure"><span>😰 压力</span><strong th:text="${attribute.pressure}">30</strong></div>
            <div class="vn-scene__stat"><span>💚 健康</span><strong th:text="${attribute.health}">70</strong></div>
            <div class="vn-scene__stat"><span>🎯 自律</span><strong th:text="${attribute.discipline}">50</strong></div>
        </div>

        <!-- 数据库拼图表单 -->
        <form th:if="${isMinigameTask}" class="relation-game" method="post"
              th:action="@{/dungeons/{dungeonId}/task/{taskId}/minigame(dungeonId=${dungeon.id}, taskId=${task.id})}">
            <input id="elapsedSeconds" type="hidden" name="elapsedSeconds" value="0">
            <div class="relation-game__top">
                <strong>选择你认为正确的表关系</strong>
                <span id="timerText" th:text="|剩余 ${task.timerSeconds} 秒|">剩余 45 秒</span>
            </div>
            <label th:each="relation : ${relationChoices}" class="relation-choice">
                <input type="checkbox" name="selectedRelations" th:value="${relation}">
                <span th:text="${relation}">user->player_attribute</span>
            </label>
            <button class="sticky-note__btn sticky-note__btn--primary" style="margin-top:12px;" type="submit">提交数据库设计</button>
        </form>

        <!-- Bug 定位小游戏表单 -->
        <form th:if="${isBugHuntTask}" id="bugHuntForm" class="relation-game bug-hunt-game" method="post"
              th:action="@{/dungeons/{dungeonId}/task/{taskId}/bughunt(dungeonId=${dungeon.id}, taskId=${task.id})}"
              onsubmit="return prepareBugHunt()">
            <input id="bhElapsed" type="hidden" name="elapsedSeconds" value="0">
            <div class="relation-game__top">
                <strong>阅读 Bug 现象，选择最可能的原因</strong>
                <span id="bhTimer" th:text="|剩余 ${task.timerSeconds} 秒|">剩余 60 秒</span>
            </div>
            <div th:each="q, qStat : ${bugQuestions}" class="bug-question">
                <p class="bug-symptom">
                    <strong th:text="|Bug #${qStat.count}：|">Bug #1：</strong>
                    <span th:text="${q.symptom}">症状描述</span>
                </p>
                <div class="bug-options">
                    <label th:each="opt, optStat : ${q.options}" class="bug-option">
                        <input type="radio" th:name="'radio_' + ${qStat.index}" th:value="${optStat.index}" required>
                        <span th:text="${opt}">选项</span>
                    </label>
                </div>
                <input type="hidden" class="bh-answer" th:data-index="${qStat.index}">
                <input type="hidden" class="bh-qid" name="questionIds" th:value="${q.id}">
            </div>
            <button class="sticky-note__btn sticky-note__btn--primary" style="margin-top:12px;" type="submit">提交 Bug 定位</button>
        </form>

        <!-- 普通选项 -->
        <div class="vn-scene__choices" th:if="${!isMinigameTask and !isBugHuntTask}">
            <form th:each="option : ${options}" method="post" th:action="@{/dungeons/{dungeonId}/task/{taskId}/option/{optionId}(dungeonId=${dungeon.id}, taskId=${task.id}, optionId=${option.id})}">
                <input type="hidden" name="minigameResult" th:value="|task=${task.minigameType};option=${option.id}|">
                <button type="submit" class="vn-choice" th:classappend="${option.isCorrect == 1 ? 'vn-choice--safe' : 'vn-choice--risky'}">
                    <strong class="vn-choice__text" th:text="${option.optionText}">选项</strong>
                    <span class="vn-choice__preview" th:text="|${option.evaluation} / ${option.score} 分|">评价</span>
                </button>
            </form>
        </div>

    </div>
</main>

<script th:inline="javascript">
    const isMinigame = /*[[${isMinigameTask}]]*/ false;
    const isBugHunt = /*[[${isBugHuntTask}]]*/ false;
    const limitSeconds = /*[[${task.timerSeconds}]]*/ 45;
    if (isMinigame || isBugHunt) {
        const startTime = Date.now();
        const timerEl = document.getElementById(isBugHunt ? 'bhTimer' : 'timerText');
        const elapsedEl = document.getElementById(isBugHunt ? 'bhElapsed' : 'elapsedSeconds');
        window.setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const remaining = Math.max(0, limitSeconds - elapsed);
            elapsedEl.value = String(elapsed);
            timerEl.textContent = `剩余 ${remaining} 秒`;
        }, 500);
    }

    function prepareBugHunt() {
        const form = document.getElementById('bugHuntForm');
        form.querySelectorAll('.bh-answer').forEach(function (hidden) {
            const idx = hidden.dataset.index;
            const selected = form.querySelector('input[name="radio_' + idx + '"]:checked');
            if (!selected) return;
            hidden.name = 'answers';
            hidden.value = selected.value;
        });
        return true;
    }
</script>

<!-- 手机底栏 -->
<div th:replace="~{fragments/layout :: game-dock}"></div>

</body>
</html>
