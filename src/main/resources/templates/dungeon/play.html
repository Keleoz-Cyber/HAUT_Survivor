<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>关卡挑战 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <link href="/css/scribble.css" rel="stylesheet">
</head>
<body>

<!-- 游戏HUD -->
<div th:replace="~{fragments/layout :: game-hud}"></div>

<main class="vn-stage scene-lab">
    <div class="vn-scene">

        <!-- 场景标签 -->
        <div class="vn-scene__meta">
            <span class="paper-chip paper-chip--blue" th:text="${dungeon.dungeonName}">副本</span>
            <span class="paper-chip paper-chip--yellow" th:text="|阶段 ${task.taskOrder}|">阶段</span>
            <span class="paper-chip paper-chip--pink handwrite" th:if="${task.timerSeconds}" th:text="|⏱ ${task.timerSeconds}s|">倒计时</span>
        </div>

        <!-- 任务标题 -->
        <h1 class="handwrite vn-scene__title" th:text="${task.taskName}">阶段任务</h1>

        <!-- 情境文字 -->
        <p class="vn-scene__story" th:text="${task.sceneText}">情境</p>

        <!-- 目标提示（引用块） -->
        <div class="quote-block" th:text="${task.targetText}">目标</div>

        <!-- 数据库拼图：表名展示板 -->
        <div class="minigame-board" th:if="${isMinigameTask}">
            <p class="handwrite" style="margin:0 0 10px;font-size:1.05rem;">📋 数据库拼图 · 表清单</p>
            <div class="minigame-tables">
                <span class="paper-chip paper-chip--white">user</span>
                <span class="paper-chip paper-chip--white">player_attribute</span>
                <span class="paper-chip paper-chip--white">event</span>
                <span class="paper-chip paper-chip--white">event_option</span>
                <span class="paper-chip paper-chip--white">dungeon_task</span>
            </div>
        </div>

        <!-- Bug 定位：题面展示板 -->
        <div class="minigame-board" th:if="${isBugHuntTask}">
            <p class="handwrite" style="margin:0 0 10px;font-size:1.05rem;">🐞 Bug 定位挑战</p>
            <div class="minigame-tables">
                <span class="paper-chip paper-chip--pink">404</span>
                <span class="paper-chip paper-chip--pink">NullPointerException</span>
                <span class="paper-chip paper-chip--pink">Mapper 注入失败</span>
                <span class="paper-chip paper-chip--pink">端口占用</span>
                <span class="paper-chip paper-chip--pink">数据不更新</span>
            </div>
        </div>

        <!-- 角色状态小条 -->
        <div class="vn-scene__status">
            <span class="paper-chip paper-chip--purple">🔧 技能 <strong th:text="${attribute.skill}">40</strong></span>
            <span class="paper-chip paper-chip--pink">😰 压力 <strong th:text="${attribute.pressure}">30</strong></span>
            <span class="paper-chip paper-chip--green">💚 健康 <strong th:text="${attribute.health}">70</strong></span>
            <span class="paper-chip paper-chip--blue">🎯 自律 <strong th:text="${attribute.discipline}">50</strong></span>
        </div>

        <!-- 数据库拼图表单 -->
        <form th:if="${isMinigameTask}" class="relation-game" method="post"
              th:action="@{/dungeons/{dungeonId}/task/{taskId}/minigame(dungeonId=${dungeon.id}, taskId=${task.id})}">
            <input id="elapsedSeconds" type="hidden" name="elapsedSeconds" value="0">
            <div class="relation-game__top" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
                <strong class="handwrite" style="font-size:1rem;">选择你认为正确的表关系</strong>
                <span id="timerText" class="paper-chip paper-chip--pink handwrite" th:text="|剩余 ${task.timerSeconds} 秒|">剩余 45 秒</span>
            </div>
            <label th:each="relation : ${relationChoices}" class="relation-choice">
                <input type="checkbox" name="selectedRelations" th:value="${relation}">
                <span th:text="${relation}" style="font-family:ui-monospace,SFMono-Regular,Consolas,monospace;">user-&gt;player_attribute</span>
            </label>
            <button class="paper-btn paper-btn--primary" style="margin-top:14px;" type="submit">📤 提交数据库设计</button>
        </form>

        <!-- Bug 定位小游戏表单 -->
        <form th:if="${isBugHuntTask}" id="bugHuntForm" class="relation-game bug-hunt-game" method="post"
              th:action="@{/dungeons/{dungeonId}/task/{taskId}/bughunt(dungeonId=${dungeon.id}, taskId=${task.id})}"
              onsubmit="return prepareBugHunt()">
            <input id="bhElapsed" type="hidden" name="elapsedSeconds" value="0">
            <div class="relation-game__top" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
                <strong class="handwrite" style="font-size:1rem;">阅读 Bug 现象，选择最可能的原因</strong>
                <span id="bhTimer" class="paper-chip paper-chip--pink handwrite" th:text="|剩余 ${task.timerSeconds} 秒|">剩余 60 秒</span>
            </div>
            <div th:each="q, qStat : ${bugQuestions}" class="bug-question">
                <p class="bug-symptom">
                    <strong th:text="|Bug #${qStat.count}：|">Bug #1：</strong>
                    <span th:text="${q.symptom}">症状描述</span>
                </p>
                <div class="bug-options">
                    <label th:each="opt, optStat : ${q.options}" class="bug-option">
                        <input type="radio" th:name="'radio_' + ${qStat.index}" th:value="${optStat.index}" required>
                        <span th:text="${opt}">选项</span>
                    </label>
                </div>
                <input type="hidden" class="bh-answer" th:data-index="${qStat.index}">
                <input type="hidden" class="bh-qid" name="questionIds" th:value="${q.id}">
            </div>
            <button class="paper-btn paper-btn--primary" style="margin-top:14px;" type="submit">📤 提交 Bug 定位</button>
        </form>

        <!-- 普通选项 -->
        <div class="vn-scene__choices" th:if="${!isMinigameTask and !isBugHuntTask}">
            <form th:each="option : ${options}" method="post" th:action="@{/dungeons/{dungeonId}/task/{taskId}/option/{optionId}(dungeonId=${dungeon.id}, taskId=${task.id}, optionId=${option.id})}">
                <input type="hidden" name="minigameResult" th:value="|task=${task.minigameType};option=${option.id}|">
                <button type="submit" class="paper-btn" style="width:100%;text-align:left;padding:14px 16px;" th:classappend="${option.isCorrect == 1 ? 'paper-btn--success' : 'paper-btn--danger'}">
                    <strong class="handwrite" style="font-size:1rem;display:block;" th:text="${option.optionText}">选项</strong>
                    <span style="display:block;font-size:0.82rem;color:var(--ink-muted);font-weight:500;margin-top:4px;" th:text="|${option.evaluation} / ${option.score} 分|">评价</span>
                </button>
            </form>
        </div>

    </div>
</main>

<script th:inline="javascript">
    const isMinigame = /*[[${isMinigameTask}]]*/ false;
    const isBugHunt = /*[[${isBugHuntTask}]]*/ false;
    const limitSeconds = /*[[${task.timerSeconds}]]*/ 45;
    if (isMinigame || isBugHunt) {
        const startTime = Date.now();
        const timerEl = document.getElementById(isBugHunt ? 'bhTimer' : 'timerText');
        const elapsedEl = document.getElementById(isBugHunt ? 'bhElapsed' : 'elapsedSeconds');
        window.setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const remaining = Math.max(0, limitSeconds - elapsed);
            elapsedEl.value = String(elapsed);
            timerEl.textContent = `剩余 ${remaining} 秒`;
        }, 500);
    }

    function prepareBugHunt() {
        const form = document.getElementById('bugHuntForm');
        form.querySelectorAll('.bh-answer').forEach(function (hidden) {
            const idx = hidden.dataset.index;
            const selected = form.querySelector('input[name="radio_' + idx + '"]:checked');
            if (!selected) return;
            hidden.name = 'answers';
            hidden.value = selected.value;
        });
        return true;
    }
</script>

<!-- 手机底栏 -->
<div th:replace="~{fragments/layout :: game-dock}"></div>

</body>
</html>
