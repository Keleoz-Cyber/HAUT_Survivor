<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>副本结算 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="survivor-body">
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container app-shell">
    <section class="event-stage event-stage--result">
        <div class="event-card">
            <p class="event-card__eyebrow">阶段结算</p>
            <h1 th:text="${taskRecord.evaluation}">完成评价</h1>
            <p class="event-card__story" th:text="${taskRecord.resultText}">结果</p>
            <!-- 属性变化展示 -->
            <div th:if="${taskRecord.attributeChange != null and taskRecord.attributeChange.hasAnyChange()}" class="attr-change-panel mb-3">
                <p class="attr-change-label">属性变化</p>
                <div class="attr-change-list">
                    <span th:if="${taskRecord.attributeChange.academicChange != 0}" th:classappend="${taskRecord.attributeChange.academicChange > 0} ? 'attr-up' : 'attr-down'" class="attr-change-item">学业 <em th:text="${taskRecord.attributeChange.academicChange > 0} ? '+' + ${taskRecord.attributeChange.academicChange} : ${taskRecord.attributeChange.academicChange}">+5</em><small th:text="'（' + ${attribute.academic} + ')'"></small></span>
                    <span th:if="${taskRecord.attributeChange.healthChange != 0}" th:classappend="${taskRecord.attributeChange.healthChange > 0} ? 'attr-up' : 'attr-down'" class="attr-change-item">健康 <em th:text="${taskRecord.attributeChange.healthChange > 0} ? '+' + ${taskRecord.attributeChange.healthChange} : ${taskRecord.attributeChange.healthChange}">+5</em><small th:text="'（' + ${attribute.health} + ')'"></small></span>
                    <span th:if="${taskRecord.attributeChange.moneyChange != 0}" th:classappend="${taskRecord.attributeChange.moneyChange > 0} ? 'attr-up' : 'attr-down'" class="attr-change-item">金钱 <em th:text="${taskRecord.attributeChange.moneyChange > 0} ? '+' + ${taskRecord.attributeChange.moneyChange} : ${taskRecord.attributeChange.moneyChange}">+5</em></span>
                    <span th:if="${taskRecord.attributeChange.socialChange != 0}" th:classappend="${taskRecord.attributeChange.socialChange > 0} ? 'attr-up' : 'attr-down'" class="attr-change-item">社交 <em th:text="${taskRecord.attributeChange.socialChange > 0} ? '+' + ${taskRecord.attributeChange.socialChange} : ${taskRecord.attributeChange.socialChange}">+5</em><small th:text="'（' + ${attribute.social} + ')'"></small></span>
                    <span th:if="${taskRecord.attributeChange.skillChange != 0}" th:classappend="${taskRecord.attributeChange.skillChange > 0} ? 'attr-up' : 'attr-down'" class="attr-change-item">技能 <em th:text="${taskRecord.attributeChange.skillChange > 0} ? '+' + ${taskRecord.attributeChange.skillChange} : ${taskRecord.attributeChange.skillChange}">+5</em><small th:text="'（' + ${attribute.skill} + ')'"></small></span>
                    <span th:if="${taskRecord.attributeChange.pressureChange != 0}" th:classappend="${taskRecord.attributeChange.pressureChange > 0} ? 'attr-down' : 'attr-up'" class="attr-change-item">压力 <em th:text="${taskRecord.attributeChange.pressureChange > 0} ? '+' + ${taskRecord.attributeChange.pressureChange} : ${taskRecord.attributeChange.pressureChange}">+5</em><small th:text="'（' + ${attribute.pressure} + ')'"></small></span>
                    <span th:if="${taskRecord.attributeChange.disciplineChange != 0}" th:classappend="${taskRecord.attributeChange.disciplineChange > 0} ? 'attr-up' : 'attr-down'" class="attr-change-item">自律 <em th:text="${taskRecord.attributeChange.disciplineChange > 0} ? '+' + ${taskRecord.attributeChange.disciplineChange} : ${taskRecord.attributeChange.disciplineChange}">+5</em><small th:text="'（' + ${attribute.discipline} + ')'"></small></span>
                </div>
            </div>
            <div class="attribute-strip">
                <div><span>得分</span><strong th:text="${taskRecord.score}">0</strong></div>
                <div><span>总分</span><strong th:text="${record.totalScore}">0</strong></div>
                <div><span>技能</span><strong th:text="${attribute.skill}">40</strong></div>
                <div><span>压力</span><strong th:text="${attribute.pressure}">30</strong></div>
            </div>
            <div th:if="${record.status == 'COMPLETED'}">
                <p class="dungeon-target" th:text="|最终评价：${record.finalEvaluation}|">最终评价</p>
                <p class="dungeon-target mb-2">过程标签</p>
                    <div th:if="${record.riskFlags != null and !record.riskFlags.isBlank()}" class="mb-3">
                    <span class="risk-flag" th:each="flag : ${#strings.arraySplit(record.riskFlags, ',')}"
                          th:classappend="${flag == 'scope_sprawl' or flag == 'schema_mist' or flag == 'bug_avalanche'} ? 'flag-bad'"
                          th:text="${flag}">标签</span>
                </div>
                <a href="/dungeons" class="btn btn-light">回到副本列表</a>
                <a href="/map" class="btn btn-outline-light">回地图继续</a>
            </div>
            <div th:unless="${record.status == 'COMPLETED'}">
                <a th:href="@{/dungeons/{id}/play(id=${record.dungeonId})}" class="btn btn-light">进入下一阶段</a>
                <a href="/map" class="btn btn-outline-light">先回地图</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
