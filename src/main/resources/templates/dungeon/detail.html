<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>副本详情 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="survivor-body">
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container app-shell">
    <section class="dungeon-cover">
        <div>
            <p class="campus-hero__eyebrow" th:text="${dungeon.dungeonType}">类型</p>
            <h1 th:text="${dungeon.dungeonName}">副本名</h1>
            <p th:text="${dungeon.description}">副本描述</p>
            <div class="dungeon-cover__meta">
                <span th:text="|预计 ${dungeon.estimatedMinutes} 分钟|">预计 8 分钟</span>
                <span th:text="${dungeon.difficultyLabel}">普通</span>
                <span th:if="${dungeon.rewardTitle}" th:text="'奖励：' + ${dungeon.rewardTitle}">奖励</span>
            </div>
            <a th:href="@{/dungeons/{id}/start(id=${dungeon.id})}" class="btn btn-light">进入副本</a>
        </div>
    </section>

    <section class="dungeon-timeline mt-4">
        <article th:each="task : ${tasks}">
            <span th:text="${task.taskOrder}">1</span>
            <div>
                <h2 th:text="${task.taskName}">阶段</h2>
                <p th:text="${task.targetText}">目标</p>
            </div>
        </article>
    </section>

    <div class="mt-3">
        <a href="/dungeons" class="btn btn-outline-light">返回副本列表</a>
    </div>
</main>
</body>
</html>
