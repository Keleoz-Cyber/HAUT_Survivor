<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>挑战封面 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="game-shell">

<!-- 游戏HUD -->
<div th:replace="~{fragments/layout :: game-hud}"></div>

<main class="dungeon-cover-v2" th:style="${dungeon.themeStyle == 'DDL'} ? '--cover-color:#7c3aed' : '--cover-color:#16a34a'">
    <div class="dungeon-cover-v2__content">

        <!-- 封面信息 -->
        <div class="dungeon-cover-v2__header">
            <p class="dungeon-cover-v2__eyebrow" th:text="${dungeon.dungeonType}">类型</p>
            <h1 class="dungeon-cover-v2__title" th:text="${dungeon.dungeonName}">副本名</h1>
            <p class="dungeon-cover-v2__story" th:text="${dungeon.description}">副本描述</p>
            <div class="dungeon-cover-v2__meta">
                <span th:text="|⏱ 预计 ${dungeon.estimatedMinutes} 分钟|">时间</span>
                <span th:text="${dungeon.difficultyLabel}">普通</span>
                <span th:if="${dungeon.rewardTitle}" th:text="'🏆 ' + ${dungeon.rewardTitle}">奖励</span>
            </div>
            <a th:href="@{/dungeons/{id}/start(id=${dungeon.id})}" class="sticky-note__btn sticky-note__btn--primary">⚔️ 开始挑战</a>
        </div>

        <!-- 阶段路线 -->
        <div class="dungeon-route">
            <p class="dungeon-route__label">关卡路线</p>
            <div class="dungeon-route__steps">
                <article class="dungeon-route__step" th:each="task, iter : ${tasks}">
                    <div class="dungeon-route__step-num" th:text="${iter.count}">1</div>
                    <div class="dungeon-route__step-info">
                        <h3 th:text="${task.taskName}">阶段名</h3>
                        <p th:text="${task.targetText}">目标</p>
                    </div>
                </article>
            </div>
        </div>

        <!-- 导航 -->
        <div class="dungeon-cover-v2__nav">
            <a href="/dungeons" class="sticky-note__btn">⚔️ 返回挑战清单</a>
            <a href="/map" class="sticky-note__btn">🗺️ 回地图</a>
        </div>

    </div>
</main>

<!-- 手机底栏 -->
<div th:replace="~{fragments/layout :: game-dock}"></div>

</body>
</html>
