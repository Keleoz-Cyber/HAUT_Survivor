<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>挑战清单 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <link href="/css/scribble.css" rel="stylesheet">
</head>
<body>

<!-- 游戏HUD -->
<div th:replace="~{fragments/layout :: game-hud}"></div>

<main class="dungeon-wall">

    <!-- ========== 标题区 ========== -->
    <section class="dungeon-wall__header">
        <p class="handwrite" style="font-size:1.3rem;margin:0 0 2px;">⚔️ 本周挑战</p>
        <h1 class="handwrite" style="font-size:2rem;margin:2px 0 4px;">选择你的战场</h1>
        <p style="color:var(--ink-muted);font-size:0.92rem;margin:4px 0 0;line-height:1.6;">每个副本都是一个完整的挑战故事，有多个阶段和不同玩法。完成副本获得丰厚奖励。</p>
    </section>

    <!-- ========== 挑战海报 ========== -->
    <section class="dungeon-wall__grid">
        <article class="paper-card" th:each="dungeon : ${dungeons}"
                 th:style="${dungeon.themeStyle == 'DDL'} ? '--poster-color:#7c3aed' : '--poster-color:#16a34a'">
            <div style="font-size:2.2rem;line-height:1;margin-bottom:4px;">
                <span th:switch="${dungeon.themeStyle}">
                    <span th:case="'DDL'">💻</span>
                    <span th:case="*">🏃</span>
                </span>
            </div>
            <h2 class="handwrite" style="font-size:1.35rem;margin:4px 0;" th:text="${dungeon.dungeonName}">副本名</h2>
            <p style="color:var(--ink-muted);font-size:0.85rem;margin:2px 0 10px;line-height:1.55;" th:text="${dungeon.description}">描述</p>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;">
                <span class="paper-chip paper-chip--blue" th:text="${dungeon.dungeonType}">类型</span>
                <span class="paper-chip paper-chip--pink" th:text="${dungeon.difficultyLabel}">难度</span>
                <span class="paper-chip paper-chip--white" th:text="|⏱ ${dungeon.estimatedMinutes} 分钟|">时间</span>
                <span class="paper-chip paper-chip--yellow" th:if="${dungeon.rewardTitle}" th:text="'🏆 ' + ${dungeon.rewardTitle}">奖励</span>
            </div>
            <a th:href="@{/dungeons/{id}(id=${dungeon.id})}" class="paper-btn paper-btn--primary">查看挑战</a>
        </article>
    </section>

    <!-- ========== 导航 ========== -->
    <div class="dungeon-wall__nav" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <a href="/map" class="paper-btn">🗺️ 回地图</a>
        <a href="/dashboard" class="paper-btn">🏠 回寝室</a>
    </div>

</main>

<!-- 手机底栏 -->
<div th:replace="~{fragments/layout :: game-dock}"></div>

</body>
</html>
