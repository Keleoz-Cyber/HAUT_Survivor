<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>挑战清单 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="game-shell">

<!-- 游戏HUD -->
<div th:replace="~{fragments/layout :: game-hud}"></div>

<main class="dungeon-wall">

    <!-- ========== 标题区 ========== -->
    <section class="dungeon-wall__header">
        <p class="dungeon-wall__eyebrow">⚔️ 本周挑战</p>
        <h1 class="dungeon-wall__title">选择你的战场</h1>
        <p class="dungeon-wall__sub">每个副本都是一个完整的挑战故事，有多个阶段和不同玩法。完成副本获得丰厚奖励。</p>
    </section>

    <!-- ========== 挑战海报 ========== -->
    <section class="dungeon-wall__grid">
        <article class="dungeon-poster" th:each="dungeon : ${dungeons}"
                 th:style="${dungeon.themeStyle == 'DDL'} ? '--poster-color:#7c3aed' : '--poster-color:#16a34a'">
            <div class="dungeon-poster__icon">
                <span th:switch="${dungeon.themeStyle}">
                    <span th:case="'DDL'">💻</span>
                    <span th:case="*">🏃</span>
                </span>
            </div>
            <div class="dungeon-poster__body">
                <h2 class="dungeon-poster__name" th:text="${dungeon.dungeonName}">副本名</h2>
                <p class="dungeon-poster__desc" th:text="${dungeon.description}">描述</p>
                <div class="dungeon-poster__meta">
                    <span class="dungeon-poster__tag" th:text="${dungeon.difficultyLabel}">难度</span>
                    <span class="dungeon-poster__tag" th:text="|⏱ ${dungeon.estimatedMinutes} 分钟|">时间</span>
                    <span class="dungeon-poster__tag" th:if="${dungeon.rewardTitle}" th:text="'🏆 ' + ${dungeon.rewardTitle}">奖励</span>
                </div>
                <a th:href="@{/dungeons/{id}(id=${dungeon.id})}" class="dungeon-poster__go">查看挑战</a>
            </div>
        </article>
    </section>

    <!-- ========== 导航 ========== -->
    <div class="dungeon-wall__nav">
        <a href="/map" class="sticky-note__btn">🗺️ 回地图</a>
        <a href="/dashboard" class="sticky-note__btn">🏠 回寝室</a>
    </div>

</main>

<!-- 手机底栏 -->
<div th:replace="~{fragments/layout :: game-dock}"></div>

</body>
</html>
