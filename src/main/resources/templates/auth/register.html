<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <section class="col-12 col-md-6 col-lg-4">
            <h1 class="h3 mb-4">创建账号</h1>
            <form method="post" action="/register" class="border rounded bg-white p-4">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input id="username" name="username" class="form-control" th:value="${username}" required>
                </div>
                <div class="mb-3">
                    <label for="nickname" class="form-label">昵称</label>
                    <input id="nickname" name="nickname" class="form-control" th:value="${nickname}" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <input id="password" name="password" type="password" class="form-control" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">注册并进入</button>
                <a href="/login" class="btn btn-link w-100 mt-2">返回登录</a>
            </form>
        </section>
    </div>
</main>
</body>
</html>
