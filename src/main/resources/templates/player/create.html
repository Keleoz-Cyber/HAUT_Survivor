<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>创建角色 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <section class="col-12 col-lg-6">
            <h1 class="h3 mb-4">创建你的莲花街角色</h1>
            <form method="post" action="/player/create" class="border rounded bg-white p-4">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div class="mb-3">
                    <label for="playerName" class="form-label">角色名</label>
                    <input id="playerName" name="playerName" class="form-control" th:value="${playerName}" required>
                </div>
                <div class="mb-3">
                    <label for="grade" class="form-label">年级</label>
                    <input id="grade" name="grade" class="form-control" th:value="${grade}" placeholder="大一" required>
                </div>
                <div class="mb-3">
                    <label for="majorType" class="form-label">专业类型</label>
                    <input id="majorType" name="majorType" class="form-control" th:value="${majorType}" placeholder="计算机类" required>
                </div>
                <div class="mb-4">
                    <label for="growthRoute" class="form-label">成长路线</label>
                    <select id="growthRoute" name="growthRoute" class="form-select" required>
                        <option th:each="route : ${growthRoutes}" th:value="${route}" th:text="${route}" th:selected="${route == growthRoute}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">进入校园</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
