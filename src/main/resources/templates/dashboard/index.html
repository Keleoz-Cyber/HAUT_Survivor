<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>仪表盘 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container app-shell">
    <header class="mb-4">
        <h1 class="h3 mb-1" th:text="${profile.playerName}">角色名</h1>
        <p class="text-muted mb-0">
            <span th:text="${user.nickname}">昵称</span>
            <span> · </span>
            <span th:text="${profile.currentTitle}">称号</span>
        </p>
    </header>

    <section class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="metric">
                <span class="metric__label">当前周目</span>
                <strong class="metric__value" th:text="${profile.currentWeek}">1</strong>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="metric">
                <span class="metric__label">等级</span>
                <strong class="metric__value" th:text="${profile.level}">1</strong>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="metric">
                <span class="metric__label">经验</span>
                <strong class="metric__value" th:text="${profile.exp}">0</strong>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="metric">
                <span class="metric__label">成长路线</span>
                <strong class="metric__value" th:text="${profile.growthRoute}">路线</strong>
            </div>
        </div>
    </section>

    <section th:if="${!warnings.isEmpty()}" class="alert alert-warning">
        <div th:each="warning : ${warnings}" th:text="${warning}"></div>
    </section>

    <section class="panel">
        <h2 class="h5 mb-3">角色属性</h2>
        <div class="row g-3">
            <div class="col-6 col-md-3"><span class="metric__label">学业</span><strong class="d-block" th:text="${attribute.academic}">60</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">健康</span><strong class="d-block" th:text="${attribute.health}">70</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">金钱</span><strong class="d-block" th:text="${attribute.money}">80</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">社交</span><strong class="d-block" th:text="${attribute.social}">50</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">技能</span><strong class="d-block" th:text="${attribute.skill}">40</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">压力</span><strong class="d-block" th:text="${attribute.pressure}">30</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">自律</span><strong class="d-block" th:text="${attribute.discipline}">50</strong></div>
        </div>
    </section>
</main>
</body>
</html>
