<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>仪表盘 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1" th:text="${profile.playerName}">角色名</h1>
            <p class="text-muted mb-0">
                <span th:text="${user.nickname}">昵称</span>
                <span> · </span>
                <span th:text="${profile.currentTitle}">称号</span>
            </p>
        </div>
        <form method="post" action="/logout">
            <button type="submit" class="btn btn-outline-secondary">退出</button>
        </form>
    </header>

    <section class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="border rounded bg-white p-3">
                <div class="text-muted">当前周目</div>
                <strong th:text="${profile.currentWeek}">1</strong>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="border rounded bg-white p-3">
                <div class="text-muted">等级</div>
                <strong th:text="${profile.level}">1</strong>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="border rounded bg-white p-3">
                <div class="text-muted">经验</div>
                <strong th:text="${profile.exp}">0</strong>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="border rounded bg-white p-3">
                <div class="text-muted">成长路线</div>
                <strong th:text="${profile.growthRoute}">路线</strong>
            </div>
        </div>
    </section>

    <section th:if="${!warnings.isEmpty()}" class="alert alert-warning">
        <div th:each="warning : ${warnings}" th:text="${warning}"></div>
    </section>

    <section class="border rounded bg-white p-4">
        <h2 class="h5 mb-3">角色属性</h2>
        <div class="row g-3">
            <div class="col-6 col-md-3"><span class="text-muted">学业</span><strong class="d-block" th:text="${attribute.academic}">60</strong></div>
            <div class="col-6 col-md-3"><span class="text-muted">健康</span><strong class="d-block" th:text="${attribute.health}">70</strong></div>
            <div class="col-6 col-md-3"><span class="text-muted">金钱</span><strong class="d-block" th:text="${attribute.money}">80</strong></div>
            <div class="col-6 col-md-3"><span class="text-muted">社交</span><strong class="d-block" th:text="${attribute.social}">50</strong></div>
            <div class="col-6 col-md-3"><span class="text-muted">技能</span><strong class="d-block" th:text="${attribute.skill}">40</strong></div>
            <div class="col-6 col-md-3"><span class="text-muted">压力</span><strong class="d-block" th:text="${attribute.pressure}">30</strong></div>
            <div class="col-6 col-md-3"><span class="text-muted">自律</span><strong class="d-block" th:text="${attribute.discipline}">50</strong></div>
        </div>
    </section>
</main>
</body>
</html>
