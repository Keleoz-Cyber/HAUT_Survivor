<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>仪表盘 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container app-shell">
    <header class="mb-4">
        <h1 class="h3 mb-1" th:text="${profile.playerName}">角色名</h1>
        <p class="text-muted mb-0">
            <span th:text="${user.nickname}">昵称</span>
            <span> · </span>
            <span th:text="${profile.currentTitle}">称号</span>
        </p>
    </header>

    <!-- 学期结束提示 -->
    <section th:if="${semesterOver}" class="panel mb-4 text-center">
        <h2 class="h4 mb-2">学期结束</h2>
        <p class="text-muted mb-2">你已经度过了 4 周的大学生活。</p>
        <div class="d-flex justify-content-center gap-2">
            <a href="/ending" class="btn btn-primary">查看学期结局</a>
            <form method="post" action="/ending/restart">
                <button type="submit" class="btn btn-outline-secondary">重开新学期</button>
            </form>
        </div>
    </section>

    <!-- 周次与行动点 -->
    <section class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="metric">
                <span class="metric__label">当前周次</span>
                <strong class="metric__value" th:text="${weekPhaseLabel}">第 1 周</strong>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="metric">
                <span class="metric__label">行动点</span>
                <strong class="metric__value">
                    <span th:text="${profile.actionPoints}">4</span>/<span th:text="${profile.maxActionPoints}">4</span>
                </strong>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="metric">
                <span class="metric__label">等级</span>
                <strong class="metric__value" th:text="${profile.level}">1</strong>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="metric">
                <span class="metric__label">成长路线</span>
                <strong class="metric__value" th:text="${profile.growthRoute}">路线</strong>
            </div>
        </div>
    </section>

    <!-- 结束本周按钮 -->
    <section th:if="${!semesterOver}" class="mb-4">
        <form method="post" action="/week/advance" class="d-inline">
            <button type="submit" class="btn btn-outline-primary btn-sm"
                    th:disabled="${profile.actionPoints == profile.maxActionPoints}">
                结束本周，进入下一周
            </button>
        </form>
        <span class="text-muted ms-2" th:if="${profile.actionPoints == profile.maxActionPoints}">
            你还没有行动过，先去地图探索吧！
        </span>
        <span class="text-muted ms-2" th:if="${profile.actionPoints == 0}">
            行动点已用完，建议结束本周。
        </span>
    </section>

    <section th:if="${!warnings.isEmpty()}" class="alert alert-warning">
        <div th:each="warning : ${warnings}" th:text="${warning}"></div>
    </section>

    <section class="panel">
        <h2 class="h5 mb-3">角色属性</h2>
        <div class="row g-3">
            <div class="col-6 col-md-3"><span class="metric__label">学业</span><strong class="d-block" th:text="${attribute.academic}">60</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">健康</span><strong class="d-block" th:text="${attribute.health}">70</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">金钱</span><strong class="d-block" th:text="${attribute.money}">80</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">社交</span><strong class="d-block" th:text="${attribute.social}">50</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">技能</span><strong class="d-block" th:text="${attribute.skill}">40</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">压力</span><strong class="d-block" th:text="${attribute.pressure}">30</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">自律</span><strong class="d-block" th:text="${attribute.discipline}">50</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">经验</span><strong class="d-block" th:text="${profile.exp}">0</strong></div>
        </div>
    </section>

    <section class="panel mt-4">
        <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
            <div>
                <h2 class="h5 mb-2">推荐行动</h2>
                <p class="text-muted mb-0" th:if="${!semesterOver}">探索校园地图、触发随机事件、挑战副本。</p>
                <p class="text-muted mb-0" th:if="${semesterOver}">学期已结束，后续功能开发中。</p>
            </div>
            <div class="d-flex gap-2">
                <a th:if="${!semesterOver}" class="btn btn-primary align-self-start" href="/map">校园地图</a>
                <a th:if="${!semesterOver}" class="btn btn-outline-secondary align-self-start" href="/dungeons">副本</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
