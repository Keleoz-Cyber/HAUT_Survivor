<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>校园踩点 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <link href="/css/scribble.css" rel="stylesheet">
</head>
<body>

<!-- 游戏HUD -->
<div th:replace="~{fragments/layout :: game-hud}"></div>

<main class="explore-page">

    <!-- ========== 页面标题 ========== -->
    <section class="paper-card tilt-left">
        <p class="handwrite">🔍 校园踩点</p>
        <h1 class="handwrite">发现未知的角落</h1>
        <p class="explore-page__sub">每个地点都有隐藏的秘密。踩点消耗 1 行动点，可能发现新事件、遇到 NPC、或获得意外收获。</p>
    </section>

    <!-- ========== 本周主题 ========== -->
    <section th:if="${weekTheme != null}" class="paper-card tilt-right">
        <span class="week-theme-card__icon" th:text="${weekTheme.icon}">🎒</span>
        <div class="week-theme-card__body">
            <h2 class="handwrite" th:text="${weekTheme.name}">开学适应周</h2>
            <p class="week-theme-card__hint" th:text="${weekTheme.hint}">提示</p>
        </div>
    </section>

    <!-- ========== 校园传闻 ========== -->
    <section th:if="${rumors != null and !rumors.isEmpty()}" class="paper-card tilt-left">
        <p class="handwrite">📣 本周传闻</p>
        <div class="rumor-board__list">
            <article class="rumor-note" th:each="rumor : ${rumors}">
                <span class="rumor-note__rarity" th:classappend="'rumor-note__rarity--' + ${rumor.rarity}">●</span>
                <div class="rumor-note__body">
                    <h3 class="rumor-note__title" th:text="${rumor.rumorTitle}">传闻标题</h3>
                    <p class="rumor-note__text" th:text="${rumor.rumorText}">传闻内容</p>
                    <span class="rumor-note__hint" th:if="${rumor.effectHint}" th:text="${rumor.effectHint}">效果提示</span>
                </div>
            </article>
        </div>
    </section>

    <!-- 状态提示 -->
    <div th:if="${param.error}" class="paper-card tilt-right" style="background: var(--pink-light);" th:text="${param.error[0]}">错误</div>
    <div th:if="${semesterOver}" class="paper-card tilt-left" style="background: var(--yellow-light);">学期已结束，无法继续探索。</div>

    <!-- ========== 探索地点列表 ========== -->
    <section class="explore-grid" th:if="${!semesterOver}">
        <article class="paper-card explore-card" th:each="loc : ${locations}" th:style="|--card-color: ${loc.themeColor}">
            <!-- 地点图标 -->
            <div class="explore-card__marker">
                <span th:switch="${loc.iconKey}">
                    <span th:case="'building'">🏫</span>
                    <span th:case="'book-open'">📚</span>
                    <span th:case="'bed'">🛏️</span>
                    <span th:case="'utensils'">🍜</span>
                    <span th:case="'activity'">🏃</span>
                    <span th:case="'code'">💻</span>
                    <span th:case="'users'">🎉</span>
                    <span th:case="'package'">📦</span>
                    <span th:case="*">📍</span>
                </span>
            </div>
            <!-- 地点信息 -->
            <div class="explore-card__body">
                <h2 class="handwrite" th:text="${loc.locationName}">地点名</h2>
                <p class="explore-card__desc" th:text="${loc.description}">描述</p>

                <!-- 传闻标记 -->
                <span th:if="${rumorCountsByLocation != null and rumorCountsByLocation[loc.id] != null}"
                      class="paper-chip paper-chip--pink">有传闻</span>

                <!-- 探索度进度 -->
                <div class="explore-card__progress">
                    <div class="stat-track">
                        <div class="stat-fill"
                             th:style="'width:' + ${exploreLevels[loc.id] != null ? exploreLevels[loc.id] : 0} + '%; background:' + ${loc.themeColor}"></div>
                    </div>
                    <span class="explore-card__progress-label"
                          th:text="'探索 ' + ${exploreLevels[loc.id] != null ? exploreLevels[loc.id] : 0} + '%'">0%</span>
                </div>

                <!-- 解锁提示 -->
                <div class="explore-card__unlock">
                    <span th:if="${exploreLevels[loc.id] == null or exploreLevels[loc.id] < 20}">🔒 20% 解锁普通事件</span>
                    <span th:if="${exploreLevels[loc.id] != null and exploreLevels[loc.id] >= 20 and exploreLevels[loc.id] < 40}">🔓 40% 解锁隐藏内容</span>
                    <span th:if="${exploreLevels[loc.id] != null and exploreLevels[loc.id] >= 40 and exploreLevels[loc.id] < 60}">🔓 60% 解锁组织入口</span>
                    <span th:if="${exploreLevels[loc.id] != null and exploreLevels[loc.id] >= 60 and exploreLevels[loc.id] < 80}">🔓 80% 解锁特殊副本</span>
                    <span th:if="${exploreLevels[loc.id] != null and exploreLevels[loc.id] >= 80 and exploreLevels[loc.id] < 100}">🌟 即将完全探索！</span>
                    <span th:if="${exploreLevels[loc.id] != null and exploreLevels[loc.id] >= 100}">✅ 已完全探索</span>
                </div>

                <!-- 探索按钮 -->
                <form method="post" th:action="@{/exploration/{id}(id=${loc.id})}">
                    <button type="submit" class="paper-btn paper-btn--primary"
                            th:disabled="${semesterOver or profile.actionPoints <= 0}">
                        <span th:if="${profile.actionPoints > 0}">🔍 踩点探索 (⚡ 1 行动点)</span>
                        <span th:if="${profile.actionPoints <= 0}">⚡ 行动点不足</span>
                    </button>
                </form>
            </div>
        </article>
    </section>

    <!-- ========== 导航 ========== -->
    <div class="sticky-note__actions" th:if="${!semesterOver}">
        <a href="/map" class="paper-btn">🗺️ 返回地图</a>
        <a href="/dashboard" class="paper-btn">🏠 回寝室</a>
    </div>

</main>

<!-- 手机底栏 -->
<div th:replace="~{fragments/layout :: game-dock}"></div>

</body>
</html>
