<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>编辑事件 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: admin-nav}"></div>
<main class="container app-shell" style="max-width: 860px; padding: 0 16px 100px;">
    <header style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;">
        <div>
            <h1 class="handwrite" style="font-size: 2rem; margin: 0;">事件表单</h1>
            <p style="color: var(--ink-muted); margin: 4px 0 0;">写下一段会发生的故事</p>
        </div>
        <a href="/admin/events" class="paper-btn">← 返回列表</a>
    </header>

    <section class="paper-card tilt-left">
        <form method="post" th:action="${action}" style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px;">
            <div style="grid-column: span 12;">
                <label for="eventName" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">事件名称</label>
                <input id="eventName" name="eventName" class="paper-input" th:value="${event.eventName}" required>
            </div>
            <div style="grid-column: span 6;">
                <label for="eventType" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">类型</label>
                <input id="eventType" name="eventType" class="paper-input" th:value="${event.eventType}" required>
            </div>
            <div style="grid-column: span 6;">
                <label for="locationId" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">地点</label>
                <select id="locationId" name="locationId" class="paper-input" required>
                    <option th:each="location : ${locations}" th:value="${location.id}" th:text="${location.locationName}" th:selected="${location.id == event.locationId}"></option>
                </select>
            </div>
            <div style="grid-column: span 12;">
                <label for="description" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">描述</label>
                <textarea id="description" name="description" class="paper-input" rows="3" th:text="${event.description}" required></textarea>
            </div>
            <div style="grid-column: span 4;">
                <label for="probability" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">触发权重</label>
                <input id="probability" name="probability" type="number" min="1" max="100" class="paper-input" th:value="${event.probability ?: 50}" required>
            </div>
            <div style="grid-column: span 4;">
                <label for="minWeek" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">最早周</label>
                <input id="minWeek" name="minWeek" type="number" min="1" class="paper-input" th:value="${event.minWeek ?: 1}" required>
            </div>
            <div style="grid-column: span 4;">
                <label for="maxWeek" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">最晚周</label>
                <input id="maxWeek" name="maxWeek" type="number" min="1" class="paper-input" th:value="${event.maxWeek ?: 20}" required>
            </div>
            <div style="grid-column: span 12; display: flex; gap: 10px; flex-wrap: wrap;">
                <button type="submit" class="paper-btn paper-btn--primary">保存</button>
                <a href="/admin/events" class="paper-btn">取消</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
