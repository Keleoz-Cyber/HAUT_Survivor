<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>编辑事件 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">事件表单</h1>
        <a href="/admin/events" class="btn btn-outline-secondary">返回列表</a>
    </header>

    <section class="border rounded bg-white p-4">
        <form method="post" th:action="${action}" class="row g-3">
            <div class="col-12 col-md-6">
                <label for="eventName" class="form-label">事件名称</label>
                <input id="eventName" name="eventName" class="form-control" th:value="${event.eventName}" required>
            </div>
            <div class="col-12 col-md-3">
                <label for="eventType" class="form-label">类型</label>
                <input id="eventType" name="eventType" class="form-control" th:value="${event.eventType}" required>
            </div>
            <div class="col-12 col-md-3">
                <label for="locationId" class="form-label">地点</label>
                <select id="locationId" name="locationId" class="form-select" required>
                    <option th:each="location : ${locations}" th:value="${location.id}" th:text="${location.locationName}" th:selected="${location.id == event.locationId}"></option>
                </select>
            </div>
            <div class="col-12">
                <label for="description" class="form-label">描述</label>
                <textarea id="description" name="description" class="form-control" rows="3" th:text="${event.description}" required></textarea>
            </div>
            <div class="col-12 col-md-4">
                <label for="probability" class="form-label">触发权重</label>
                <input id="probability" name="probability" type="number" min="1" max="100" class="form-control" th:value="${event.probability ?: 50}" required>
            </div>
            <div class="col-12 col-md-4">
                <label for="minWeek" class="form-label">最早周</label>
                <input id="minWeek" name="minWeek" type="number" min="1" class="form-control" th:value="${event.minWeek ?: 1}" required>
            </div>
            <div class="col-12 col-md-4">
                <label for="maxWeek" class="form-label">最晚周</label>
                <input id="maxWeek" name="maxWeek" type="number" min="1" class="form-control" th:value="${event.maxWeek ?: 20}" required>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
