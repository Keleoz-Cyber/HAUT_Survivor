<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>事件管理 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">事件管理</h1>
            <p class="text-muted mb-0">维护 Demo 中的校园随机事件。</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/admin/events/new" class="btn btn-primary">新增事件</a>
            <a href="/dashboard" class="btn btn-outline-secondary">返回仪表盘</a>
        </div>
    </header>

    <section class="border rounded bg-white p-4">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>名称</th>
                    <th>类型</th>
                    <th>地点 ID</th>
                    <th>概率</th>
                    <th>周数</th>
                    <th>状态</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="event : ${events}">
                    <td th:text="${event.eventName}">事件</td>
                    <td th:text="${event.eventType}">类型</td>
                    <td th:text="${event.locationId}">1</td>
                    <td th:text="${event.probability}">50</td>
                    <td><span th:text="${event.minWeek}">1</span>-<span th:text="${event.maxWeek}">20</span></td>
                    <td th:text="${event.status == 1 ? '启用' : '停用'}">启用</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/events/{id}/edit(id=${event.id})}">编辑</a>
                        <form class="d-inline" method="post" th:action="@{/admin/events/{id}/disable(id=${event.id})}" th:if="${event.status == 1}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">停用</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
