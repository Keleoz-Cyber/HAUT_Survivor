<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>事件管理 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: admin-nav}"></div>
<main class="container app-shell" style="max-width: 1080px; padding: 0 16px 100px;">
    <header style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;">
        <div>
            <h1 class="handwrite" style="font-size: 2rem; margin: 0;">事件管理</h1>
            <p style="color: var(--ink-muted); margin: 4px 0 0;">手账上的剧情条目</p>
        </div>
        <a href="/admin/events/new" class="paper-btn paper-btn--primary">+ 新增事件</a>
    </header>

    <section class="paper-card">
        <div style="overflow-x: auto;">
            <table class="paper-table">
                <thead>
                <tr>
                    <th>名称</th>
                    <th>类型</th>
                    <th>地点 ID</th>
                    <th>概率</th>
                    <th>周数</th>
                    <th>状态</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="event : ${events}">
                    <td>
                        <strong th:text="${event.eventName}" style="font-size: 0.95rem;">事件</strong>
                    </td>
                    <td>
                        <span class="paper-chip paper-chip--blue" th:text="${event.eventType}">类型</span>
                    </td>
                    <td th:text="${event.locationId}" style="font-weight: 800;">1</td>
                    <td th:text="${event.probability}" style="font-weight: 800;">50</td>
                    <td>
                        <span class="paper-chip paper-chip--white">
                            <span th:text="${event.minWeek}">1</span>-<span th:text="${event.maxWeek}">20</span>
                        </span>
                    </td>
                    <td>
                        <span class="paper-chip"
                              th:classappend="${event.status == 1} ? ' paper-chip--green' : ' paper-chip--pink'"
                              th:text="${event.status == 1 ? '启用' : '停用'}">启用</span>
                    </td>
                    <td style="text-align: right; white-space: nowrap;">
                        <a class="paper-btn" th:href="@{/admin/events/{id}/edit(id=${event.id})}" style="font-size: 0.8rem; padding: 4px 12px; margin-right: 4px;">编辑</a>
                        <form style="display: inline;" method="post" th:action="@{/admin/events/{id}/disable(id=${event.id})}" th:if="${event.status == 1}">
                            <button type="submit" class="paper-btn paper-btn--danger" style="font-size: 0.8rem; padding: 4px 12px;">停用</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
