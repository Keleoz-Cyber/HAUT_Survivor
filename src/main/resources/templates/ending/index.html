<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学期结局 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="survivor-body">
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container app-shell">

    <!-- 学期尚未结束 -->
    <section th:if="${!semesterOver}" class="panel text-center">
        <h2 class="h4 mb-2">学期尚未结束</h2>
        <p class="text-muted">你还需要继续度过剩余的周次，学期结束后才能结算。</p>
        <a href="/dashboard" class="btn btn-primary mt-3">返回仪表盘</a>
    </section>

    <!-- 学期已结束但未结算 -->
    <section th:if="${semesterOver and !hasSettled}" class="text-center">
        <div class="event-stage" style="background:linear-gradient(135deg, rgba(37,99,235,0.15), rgba(15,23,42,0.92))">
            <div class="event-card">
                <div class="event-card__meta">
                    <span>学期结算</span>
                </div>
                <h1>学期结束了！</h1>
                <p class="event-card__story">你已经度过了 4 周的大学生活。现在来看看你的路线画像吧！</p>

                <!-- 最终属性快照 -->
                <div class="attribute-strip mb-4">
                    <div><span>学业</span><strong th:text="${attribute.academic}">60</strong></div>
                    <div><span>健康</span><strong th:text="${attribute.health}">70</strong></div>
                    <div><span>社交</span><strong th:text="${attribute.social}">50</strong></div>
                    <div><span>技能</span><strong th:text="${attribute.skill}">40</strong></div>
                    <div><span>压力</span><strong th:text="${attribute.pressure}">30</strong></div>
                    <div><span>自律</span><strong th:text="${attribute.discipline}">50</strong></div>
                </div>

                <form method="post" action="/ending/settle">
                    <button type="submit" class="btn btn-light btn-lg">揭晓你的结局</button>
                </form>
            </div>
        </div>
    </section>

    <!-- 已结算：展示结局 -->
    <section th:if="${hasSettled and ending != null}" class="text-center">
        <div class="event-stage" th:style="'background:linear-gradient(135deg,' + ${ending.themeColor} + '33, rgba(15,23,42,0.95))'">
            <div class="event-card">
                <div style="font-size:4rem; margin-bottom:1rem;" th:text="${ending.icon}">🏆</div>
                <div class="event-card__meta">
                    <span th:text="${ending.endingType}">类型</span>
                </div>
                <h1 th:text="${ending.endingName}">结局名</h1>
                <p class="event-card__story" th:text="${ending.description}">结局描述</p>

                <!-- 结算时的属性 -->
                <div class="attribute-strip mb-4" th:if="${userEnding != null}">
                    <div><span>学业</span><strong th:text="${userEnding.academic}">60</strong></div>
                    <div><span>健康</span><strong th:text="${userEnding.health}">70</strong></div>
                    <div><span>社交</span><strong th:text="${userEnding.social}">50</strong></div>
                    <div><span>技能</span><strong th:text="${userEnding.skill}">40</strong></div>
                    <div><span>压力</span><strong th:text="${userEnding.pressure}">30</strong></div>
                    <div><span>自律</span><strong th:text="${userEnding.discipline}">50</strong></div>
                </div>

                <div class="mt-3">
                    <p class="text-muted">成长路线：<span th:text="${userEnding.growthRoute}">路线</span></p>
                </div>

                <div class="mt-4">
                    <a href="/dashboard" class="btn btn-outline-light">返回仪表盘</a>
                </div>
            </div>
        </div>
    </section>

    <!-- 解锁历史 -->
    <section th:if="${!history.isEmpty()}" class="panel mt-4">
        <h2 class="h5 mb-3">已解锁结局</h2>
        <div class="row g-2">
            <div class="col-6 col-md-4 col-lg-3" th:each="h : ${history}">
                <div class="panel text-center" th:style="'border-top:3px solid ' + ${ending != null and ending.id == h.endingId ? ending.themeColor : '#6b7280'}">
                    <div style="font-size:2rem;" th:text="${ending != null and ending.id == h.endingId ? ending.icon : '🔒'}">🏆</div>
                    <p class="small mb-0" th:text="${h.growthRoute}">路线</p>
                    <p class="text-muted small" th:text="${#temporals.format(h.createTime, 'yyyy-MM-dd')}">日期</p>
                </div>
            </div>
        </div>
    </section>

</main>
</body>
</html>
