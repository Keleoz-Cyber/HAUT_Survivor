<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学期回忆 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="game-shell">

<!-- 游戏HUD -->
<div th:replace="~{fragments/layout :: game-hud}"></div>

<main class="semester-report">

    <!-- ===== 学期尚未结束 ===== -->
    <section th:if="${!semesterOver}" class="semester-report__pending">
        <p class="semester-report__pending-icon">📚</p>
        <h1>学期尚未结束</h1>
        <p>你还需要继续度过剩余的周次，学期结束后才能结算。</p>
        <a href="/dashboard" class="sticky-note__btn sticky-note__btn--primary">🏠 回寝室</a>
    </section>

    <!-- ===== 学期已结束但未结算 ===== -->
    <section th:if="${semesterOver and !hasSettled}" class="semester-report__settle">
        <p class="semester-report__settle-icon">🎓</p>
        <h1>学期结束了！</h1>
        <p>你已经度过了这一学期。现在来看看你的路线画像吧！</p>

        <!-- 属性快照 -->
        <div class="semester-report__attrs">
            <div><span>学业</span><strong th:text="${attribute.academic}">60</strong></div>
            <div><span>健康</span><strong th:text="${attribute.health}">70</strong></div>
            <div><span>社交</span><strong th:text="${attribute.social}">50</strong></div>
            <div><span>技能</span><strong th:text="${attribute.skill}">40</strong></div>
            <div><span>压力</span><strong th:text="${attribute.pressure}">30</strong></div>
            <div><span>自律</span><strong th:text="${attribute.discipline}">50</strong></div>
        </div>

        <form method="post" action="/ending/settle">
            <button type="submit" class="sticky-note__btn sticky-note__btn--primary" style="font-size:1.1rem; padding:12px 24px;">✨ 揭晓你的结局</button>
        </form>
    </section>

    <!-- ===== 已结算：展示结局 ===== -->
    <section th:if="${hasSettled and ending != null}" class="semester-report__ending" th:style="|--ending-color: ${ending.themeColor}">
        <div class="semester-report__ending-icon" th:text="${ending.icon}">🏆</div>
        <div class="semester-report__ending-type">
            <span th:text="${ending.endingType}">类型</span>
        </div>
        <h1 class="semester-report__ending-title" th:text="${ending.endingName}">结局名</h1>
        <p class="semester-report__ending-desc" th:text="${ending.description}">结局描述</p>

        <!-- 属性快照 -->
        <div class="semester-report__attrs" th:if="${userEnding != null}">
            <div><span>学业</span><strong th:text="${userEnding.academic}">60</strong></div>
            <div><span>健康</span><strong th:text="${userEnding.health}">70</strong></div>
            <div><span>社交</span><strong th:text="${userEnding.social}">50</strong></div>
            <div><span>技能</span><strong th:text="${userEnding.skill}">40</strong></div>
            <div><span>压力</span><strong th:text="${userEnding.pressure}">30</strong></div>
            <div><span>自律</span><strong th:text="${userEnding.discipline}">50</strong></div>
        </div>

        <p class="semester-report__route" th:if="${userEnding != null}">
            成长路线：<strong th:text="${userEnding.growthRoute}">路线</strong>
        </p>

        <div class="semester-growth-portrait"
             th:if="${growthPortrait != null}">
            <p class="semester-growth-portrait__label">学期成长画像</p>
            <h2 th:text="${growthPortrait.growthKeyword}">探索新生</h2>
            <p class="semester-growth-portrait__desc"
               th:text="${growthPortrait.growthDescription}">
                这个学期留下了新的成长记录。
            </p>

            <div class="semester-growth-portrait__facts">
                <div>
                    <span>关键关系</span>
                    <strong th:text="${growthPortrait.keyNpcName != null ? growthPortrait.keyNpcName + ' · ' + growthPortrait.keyNpcStage : '暂无'}">暂无</strong>
                </div>
                <div>
                    <span>关键周</span>
                    <strong th:text="${growthPortrait.keyWeekNumber != null ? '第 ' + growthPortrait.keyWeekNumber + ' 周' : '尚未形成'}">尚未形成</strong>
                </div>
                <div>
                    <span>主要影响</span>
                    <strong th:text="${growthPortrait.mainSourceLabel}">校园影响</strong>
                </div>
            </div>
        </div>

        <div class="semester-report__actions">
            <a href="/dashboard" class="sticky-note__btn">🏠 回寝室</a>
            <form method="post" action="/ending/restart" style="display:inline">
                <button type="submit" class="sticky-note__btn sticky-note__btn--primary">🔄 再来一学期</button>
            </form>
        </div>
    </section>

    <!-- ===== 历史结局图鉴 ===== -->
    <section th:if="${!history.isEmpty()}" class="memory-gallery">
        <p class="memory-gallery__label">📖 结局图鉴</p>
        <div class="memory-gallery__grid">
            <article class="memory-card" th:each="h : ${history}"
                     th:style="'border-top:3px solid ' + ${ending != null and ending.id == h.endingId ? ending.themeColor : '#475569'}">
                <div class="memory-card__icon" th:text="${ending != null and ending.id == h.endingId ? ending.icon : '🔒'}">🏆</div>
                <p class="memory-card__route" th:text="${h.growthRoute}">路线</p>
                <p class="memory-card__date" th:text="${#temporals.format(h.createTime, 'yyyy-MM-dd')}">日期</p>
            </article>
        </div>
    </section>

</main>

<!-- 手机底栏 -->
<div th:replace="~{fragments/layout :: game-dock}"></div>

</body>
</html>
