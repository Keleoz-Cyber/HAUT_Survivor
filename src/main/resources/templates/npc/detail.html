<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>校园搭子 - HAUT Survivor</title>
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: game-hud}"></div>

<main class="explore-page">

    <!-- ========== NPC 名片 ========== -->
    <section class="paper-card tilt-left">
        <div class="encounter-card__header">
            <span class="paper-avatar" style="width:72px;height:72px;font-size:2.4rem;" th:text="${npc.avatarIcon}">👤</span>
            <div>
                <span class="paper-chip paper-chip--blue" th:text="${npc.npcType}">校园人物</span>
                <h1 class="handwrite" th:text="${npc.npcName}">NPC</h1>
                <p class="explore-card__desc" th:text="${npc.description}">描述</p>
            </div>
        </div>
        <div class="sticky-note__actions">
            <span class="paper-chip paper-chip--purple" th:text="'关系：' + ${relationSummary.label}">关系：点头之交</span>
            <span class="paper-chip paper-chip--yellow" th:text="'熟悉度 ' + ${relation != null ? relation.familiarity : 0}">熟悉度 0</span>
            <span th:if="${currentBuddy != null and currentBuddy.npcId == npc.id}" class="paper-chip paper-chip--green">本周搭子</span>
        </div>
        <div th:if="${relationSummary != null}">
            <div class="explore-card__progress">
                <div class="stat-track">
                    <div class="stat-fill stat-fill--social" th:style="'width:' + ${relationSummary.progressPercent} + '%'"></div>
                </div>
                <span class="explore-card__progress-label" th:text="${relationSummary.progressPercent} + '%'">0%</span>
            </div>
            <p th:text="${relationSummary.description}">你们刚开始认识。</p>
            <p class="explore-card__desc" th:text="${relationSummary.nextStageHint}">继续互动可以推进关系。</p>
        </div>
    </section>

    <!-- ========== 互动操作头 ========== -->
    <section class="paper-card tilt-right">
        <div class="goal-progress__header">
            <div>
                <p class="explore-card__unlock">校园关系</p>
                <h2 class="handwrite">这周要和 TA 做点什么？</h2>
            </div>
            <form th:if="${currentBuddy == null and relation != null and relation.familiarity >= 50}"
                  th:action="@{/npcs/{id}/buddy(id=${npc.id})}" method="post">
                <button type="submit" class="paper-btn paper-btn--primary">设为本周搭子</button>
            </form>
            <span th:if="${currentBuddy != null and currentBuddy.npcId == npc.id}" class="paper-chip paper-chip--green">已结成搭子</span>
        </div>

        <p class="explore-card__desc" th:if="${relation == null or relation.familiarity < 50}">
            熟悉度达到 50 后，可以选择 TA 作为本周搭子，互动时会有额外加成。
        </p>
    </section>

    <!-- ========== 互动选项 ========== -->
    <section class="paper-card tilt-left" th:each="interaction : ${interactions}">
        <div class="goal-progress__header">
            <div class="goal-progress__body">
                <h3 class="handwrite" th:text="${interaction.interactionName}">互动名称</h3>
                <p class="explore-card__desc" th:text="${interaction.description}">互动描述</p>
                <span class="paper-chip paper-chip--orange" th:text="'需要熟悉度 ' + ${interaction.requiredFamiliarity}">需要熟悉度 0</span>
            </div>
            <form th:action="@{/npcs/{npcId}/interactions/{interactionId}(npcId=${npc.id},interactionId=${interaction.id})}"
                  method="post">
                <button type="submit" class="paper-btn"
                        th:disabled="${semesterOver or profile.actionPoints <= 0}">互动</button>
            </form>
        </div>
    </section>

    <!-- ========== 导航 ========== -->
    <div class="sticky-note__actions">
        <a href="/dashboard" class="paper-btn">回寝室</a>
        <a href="/exploration" class="paper-btn">继续踩点</a>
    </div>

</main>

<div th:replace="~{fragments/layout :: game-dock}"></div>
</body>
</html>
