<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>事件 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <link href="/css/scribble.css" rel="stylesheet">
</head>
<body>

<!-- 游戏HUD -->
<div th:replace="~{fragments/layout :: game-hud}"></div>

<!-- ========== 事件结算页 ========== -->
<main class="vn-stage" th:if="${resultText}" th:classappend="${event != null ? event.sceneImage : ''}">
    <div class="vn-result">
        <!-- 结算标题 -->
        <div class="vn-result__header">
            <span class="vn-result__eyebrow paper-chip paper-chip--yellow">📋 事件结算</span>
            <h1 class="vn-result__title handwrite--display">这次发生了什么</h1>
        </div>
        <!-- 结果描述 -->
        <p class="vn-result__story" th:text="${resultText}">结果</p>

        <!-- 属性变化 -->
        <div th:if="${attributeChange != null and attributeChange.hasAnyChange()}" class="vn-result__changes">
            <p class="vn-result__changes-label">状态变化</p>
            <div class="vn-result__changes-list">
                <span th:if="${attributeChange.academicChange != 0}"
                      class="vn-result__change paper-chip"
                      th:classappend="${attributeChange.academicChange > 0} ? 'paper-chip--green' : 'paper-chip--pink'">
                    📚 学业 <em th:text="${attributeChange.academicChange > 0} ? '+' + ${attributeChange.academicChange} : ${attributeChange.academicChange}">+5</em>
                    <small th:text="'（' + ${attribute.academic} + ')'"></small>
                </span>
                <span th:if="${attributeChange.healthChange != 0}"
                      class="vn-result__change paper-chip"
                      th:classappend="${attributeChange.healthChange > 0} ? 'paper-chip--green' : 'paper-chip--pink'">
                    💚 健康 <em th:text="${attributeChange.healthChange > 0} ? '+' + ${attributeChange.healthChange} : ${attributeChange.healthChange}">+5</em>
                    <small th:text="'（' + ${attribute.health} + ')'"></small>
                </span>
                <span th:if="${attributeChange.moneyChange != 0}"
                      class="vn-result__change paper-chip"
                      th:classappend="${attributeChange.moneyChange > 0} ? 'paper-chip--green' : 'paper-chip--pink'">
                    💰 金钱 <em th:text="${attributeChange.moneyChange > 0} ? '+' + ${attributeChange.moneyChange} : ${attributeChange.moneyChange}">+5</em>
                </span>
                <span th:if="${attributeChange.socialChange != 0}"
                      class="vn-result__change paper-chip"
                      th:classappend="${attributeChange.socialChange > 0} ? 'paper-chip--green' : 'paper-chip--pink'">
                    🤝 社交 <em th:text="${attributeChange.socialChange > 0} ? '+' + ${attributeChange.socialChange} : ${attributeChange.socialChange}">+5</em>
                    <small th:text="'（' + ${attribute.social} + ')'"></small>
                </span>
                <span th:if="${attributeChange.skillChange != 0}"
                      class="vn-result__change paper-chip"
                      th:classappend="${attributeChange.skillChange > 0} ? 'paper-chip--green' : 'paper-chip--pink'">
                    🔧 技能 <em th:text="${attributeChange.skillChange > 0} ? '+' + ${attributeChange.skillChange} : ${attributeChange.skillChange}">+5</em>
                    <small th:text="'（' + ${attribute.skill} + ')'"></small>
                </span>
                <span th:if="${attributeChange.pressureChange != 0}"
                      class="vn-result__change paper-chip"
                      th:classappend="${attributeChange.pressureChange > 0} ? 'paper-chip--pink' : 'paper-chip--green'">
                    😰 压力 <em th:text="${attributeChange.pressureChange > 0} ? '+' + ${attributeChange.pressureChange} : ${attributeChange.pressureChange}">+5</em>
                    <small th:text="'（' + ${attribute.pressure} + ')'"></small>
                </span>
                <span th:if="${attributeChange.disciplineChange != 0}"
                      class="vn-result__change paper-chip"
                      th:classappend="${attributeChange.disciplineChange > 0} ? 'paper-chip--green' : 'paper-chip--pink'">
                    🎯 自律 <em th:text="${attributeChange.disciplineChange > 0} ? '+' + ${attributeChange.disciplineChange} : ${attributeChange.disciplineChange}">+5</em>
                    <small th:text="'（' + ${attribute.discipline} + ')'"></small>
                </span>
                <span th:if="${attributeChange.expChange != 0}"
                      class="vn-result__change paper-chip paper-chip--green">
                    ✨ 经验 <em th:text="${attributeChange.expChange > 0} ? '+' + ${attributeChange.expChange} : ${attributeChange.expChange}">+5</em>
                </span>
            </div>
        </div>

        <!-- 当前状态速览 -->
        <div class="vn-result__stats">
            <span class="paper-chip paper-chip--blue">学业 <strong th:text="${attribute.academic}">60</strong></span>
            <span class="paper-chip paper-chip--green">健康 <strong th:text="${attribute.health}">70</strong></span>
            <span class="paper-chip paper-chip--yellow">金钱 <strong th:text="${attribute.money}">80</strong></span>
            <span class="paper-chip paper-chip--pink">社交 <strong th:text="${attribute.social}">50</strong></span>
            <span class="paper-chip paper-chip--purple">技能 <strong th:text="${attribute.skill}">40</strong></span>
            <span class="paper-chip paper-chip--orange">压力 <strong th:text="${attribute.pressure}">30</strong></span>
            <span class="paper-chip paper-chip--blue">自律 <strong th:text="${attribute.discipline}">50</strong></span>
        </div>

        <!-- 后续行动 -->
        <div class="vn-result__actions">
            <a href="/map" class="paper-btn paper-btn--primary">🗺️ 继续逛校园</a>
            <a href="/dashboard" class="paper-btn">🏠 回寝室</a>
        </div>
    </div>
</main>

<!-- ========== 视觉小说事件页 ========== -->
<main class="vn-stage" th:unless="${resultText}" th:classappend="${event.sceneImage}">
    <div class="vn-scene" th:classappend="${event.sceneImage}">
        <!-- 离开按钮（移动端放顶部，桌面端放底部） -->
        <div class="vn-scene__leave-mobile">
            <form action="/map">
                <button type="submit" class="paper-btn">🚪 先离开</button>
            </form>
        </div>
        <!-- 场景标签 -->
        <div class="vn-scene__meta">
            <span th:if="${location}" th:text="${location.locationName}" class="paper-chip paper-chip--blue">📍 地点</span>
            <span th:if="${event.moodTag}" th:text="${event.moodTag}" class="paper-chip paper-chip--purple">🎭 氛围</span>
        </div>

        <!-- 事件标题 -->
        <h1 class="vn-scene__title handwrite--display" th:text="${event.eventName}">事件名称</h1>

        <!-- 情境描述 -->
        <p class="vn-scene__story" th:text="${event.description}">事件描述</p>

        <!-- 角色状态小条 -->
        <div class="vn-scene__status">
            <span class="paper-chip paper-chip--purple">🔧 技能 <strong th:text="${attribute.skill}">40</strong></span>
            <span class="paper-chip paper-chip--orange">😰 压力 <strong th:text="${attribute.pressure}">30</strong></span>
            <span class="paper-chip paper-chip--green">💚 健康 <strong th:text="${attribute.health}">70</strong></span>
            <span class="paper-chip paper-chip--blue">🎯 自律 <strong th:text="${attribute.discipline}">50</strong></span>
        </div>

        <!-- 选择按钮 -->
        <div class="vn-scene__choices">
            <form th:each="option : ${options}" method="post"
                  th:action="@{/map/event/{eventId}/option/{optionId}(eventId=${event.id}, optionId=${option.id})}">
                <button type="submit" class="event-option"
                        th:classappend="${option.riskLevel == 'low'} ? 'risk-low' : (${option.riskLevel == 'medium'} ? 'risk-medium' : 'risk-high')">
                    <span class="vn-choice__label"
                          th:if="${option.riskLevel == 'low'}">🛡️ 稳妥</span>
                    <span class="vn-choice__label"
                          th:if="${option.riskLevel == 'medium'}">⚖️ 冒险</span>
                    <span class="vn-choice__label"
                          th:if="${option.riskLevel == 'high'}">🔥 硬刚</span>
                    <strong class="vn-choice__text" th:text="${option.optionText}">选项文本</strong>
                    <span class="vn-choice__preview" th:text="${option.previewText}">后果预览</span>
                </button>
            </form>
        </div>

        <!-- 桌面端离开按钮 -->
        <form action="/map" class="vn-scene__leave">
            <button type="submit" class="paper-btn">🚪 先离开这里</button>
        </form>
    </div>
</main>

<!-- 手机底栏 -->
<div th:replace="~{fragments/layout :: game-dock}"></div>

</body>
</html>
