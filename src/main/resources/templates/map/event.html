<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>校园事件 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="survivor-body">
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container app-shell">
    <section th:if="${resultText}" class="event-stage event-stage--result">
        <div class="event-card">
            <p class="event-card__eyebrow">事件结算</p>
            <h1>行动产生了后果</h1>
            <p class="event-card__story" th:text="${resultText}">结果</p>
            <div class="attribute-strip mb-4">
                <div><span>学业</span><strong th:text="${attribute.academic}">60</strong></div>
                <div><span>健康</span><strong th:text="${attribute.health}">70</strong></div>
                <div><span>金钱</span><strong th:text="${attribute.money}">80</strong></div>
                <div><span>社交</span><strong th:text="${attribute.social}">50</strong></div>
                <div><span>技能</span><strong th:text="${attribute.skill}">40</strong></div>
                <div><span>压力</span><strong th:text="${attribute.pressure}">30</strong></div>
                <div><span>自律</span><strong th:text="${attribute.discipline}">50</strong></div>
                <div><span>经验</span><strong th:text="${profile.exp}">0</strong></div>
            </div>
            <a href="/map" class="btn btn-primary">继续探索</a>
            <a href="/dashboard" class="btn btn-outline-light">返回仪表盘</a>
        </div>
    </section>

    <section th:unless="${resultText}" class="event-stage" th:classappend="${event.sceneImage}">
        <div class="event-card">
            <div class="event-card__meta">
                <span th:if="${location}" th:text="${location.locationName}">地点</span>
                <span th:text="${event.moodTag}">氛围</span>
            </div>
            <h1 th:text="${event.eventName}">事件名称</h1>
            <p class="event-card__story" th:text="${event.description}">事件描述</p>
            <div class="attribute-strip">
                <div><span>技能</span><strong th:text="${attribute.skill}">40</strong></div>
                <div><span>压力</span><strong th:text="${attribute.pressure}">30</strong></div>
                <div><span>健康</span><strong th:text="${attribute.health}">70</strong></div>
                <div><span>自律</span><strong th:text="${attribute.discipline}">50</strong></div>
            </div>
            <div class="event-options">
                <form th:each="option : ${options}" method="post" th:action="@{/map/event/{eventId}/option/{optionId}(eventId=${event.id}, optionId=${option.id})}">
                    <button type="submit" class="event-option" th:classappend="|risk-${option.riskLevel}|">
                        <strong th:text="${option.optionText}">选项</strong>
                        <span th:text="${option.previewText}">后果预览</span>
                    </button>
                </form>
            </div>
            <form class="mt-3" action="/map">
                <button class="btn btn-outline-light" type="submit">先离开这里</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
