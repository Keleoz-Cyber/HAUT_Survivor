<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>校园事件 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container app-shell">
    <section th:if="${resultText}" class="panel">
        <h1 class="h4 mb-3">事件结算</h1>
        <p th:text="${resultText}">结果</p>
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3"><span class="metric__label">学业</span><strong class="d-block" th:text="${attribute.academic}">60</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">健康</span><strong class="d-block" th:text="${attribute.health}">70</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">金钱</span><strong class="d-block" th:text="${attribute.money}">80</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">社交</span><strong class="d-block" th:text="${attribute.social}">50</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">技能</span><strong class="d-block" th:text="${attribute.skill}">40</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">压力</span><strong class="d-block" th:text="${attribute.pressure}">30</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">自律</span><strong class="d-block" th:text="${attribute.discipline}">50</strong></div>
            <div class="col-6 col-md-3"><span class="metric__label">经验</span><strong class="d-block" th:text="${profile.exp}">0</strong></div>
        </div>
        <a href="/map" class="btn btn-primary">继续探索</a>
        <a href="/dashboard" class="btn btn-outline-secondary">返回仪表盘</a>
    </section>

    <section th:unless="${resultText}" class="panel">
        <p class="text-muted mb-1" th:if="${location}" th:text="${location.locationName}">地点</p>
        <h1 class="h4" th:text="${event.eventName}">事件名称</h1>
        <p th:text="${event.description}">事件描述</p>
        <div class="d-grid gap-2">
            <form th:each="option : ${options}" method="post" th:action="@{/map/event/{eventId}/option/{optionId}(eventId=${event.id}, optionId=${option.id})}">
                <button type="submit" class="btn btn-outline-primary w-100 text-start" th:text="${option.optionText}">选项</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
