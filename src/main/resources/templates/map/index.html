<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>莲花街地图 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">莲花街校区</h1>
            <p class="text-muted mb-0">选择地点，触发随机校园事件。</p>
        </div>
        <a href="/dashboard" class="btn btn-outline-secondary">返回仪表盘</a>
    </header>

    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>

    <section class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="location : ${locations}">
            <article class="border rounded bg-white p-3 h-100">
                <h2 class="h5" th:text="${location.locationName}">地点</h2>
                <p class="text-muted" th:text="${location.description}">描述</p>
                <a class="btn btn-primary" th:href="@{/map/location/{id}/event(id=${location.id})}">前往</a>
            </article>
        </div>
    </section>
</main>
</body>
</html>
