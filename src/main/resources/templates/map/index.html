<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>莲花街校区 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="game-shell">

<!-- 游戏HUD -->
<div th:replace="~{fragments/layout :: game-hud}"></div>

<main class="campus-map">

    <!-- ========== 地图标题区 ========== -->
    <section class="campus-map__header">
        <p class="campus-map__eyebrow">🗺️ 莲花街校区行动地图</p>
        <h1 class="campus-map__title" th:if="${!semesterOver}">今晚去哪儿续命？</h1>
        <h1 class="campus-map__title" th:if="${semesterOver}">学期已结束</h1>
        <p class="campus-map__sub" th:if="${!semesterOver}">
            <span th:text="${profile.playerName}">玩家</span>，剩余
            <strong th:text="${profile.actionPoints}">3</strong> 次行动
        </p>
    </section>

    <!-- ========== 本周主题 ========== -->
    <section th:if="${weekTheme != null}" class="week-theme-card">
        <span class="week-theme-card__icon" th:text="${weekTheme.icon}">🎒</span>
        <div class="week-theme-card__body">
            <h2 class="week-theme-card__name" th:text="${weekTheme.name}">开学适应周</h2>
            <p class="week-theme-card__hint" th:text="${weekTheme.hint}">提示</p>
        </div>
    </section>

    <!-- ========== 校园传闻 ========== -->
    <section th:if="${rumors != null and !rumors.isEmpty()}" class="rumor-board rumor-board--compact">
        <p class="rumor-board__title">📣 传闻</p>
        <div class="rumor-board__list">
            <article class="rumor-note" th:each="rumor : ${rumors}">
                <span class="rumor-note__rarity" th:classappend="'rumor-note__rarity--' + ${rumor.rarity}">●</span>
                <div class="rumor-note__body">
                    <h3 class="rumor-note__title" th:text="${rumor.rumorTitle}">传闻标题</h3>
                    <p class="rumor-note__text" th:text="${rumor.rumorText}">传闻内容</p>
                </div>
            </article>
        </div>
    </section>

    <!-- 信息提示 -->
    <div th:if="${message}" class="campus-map__msg" th:text="${message}">提示</div>

    <!-- ========== 校园节点地图 ========== -->
    <section class="campus-map__grid" th:if="${!semesterOver}">
        <article class="campus-node"
                 th:each="location : ${locations}"
                 th:classappend="${location.backgroundImage}"
                 th:style="|--node-color: ${location.themeColor}|">
            <!-- 节点图标 -->
            <div class="campus-node__marker">
                <span th:switch="${location.iconKey}">
                    <span th:case="'building'">🏫</span>
                    <span th:case="'book-open'">📚</span>
                    <span th:case="'bed'">🛏️</span>
                    <span th:case="'utensils'">🍜</span>
                    <span th:case="'activity'">🏃</span>
                    <span th:case="'code'">💻</span>
                    <span th:case="'users'">🎉</span>
                    <span th:case="'package'">📦</span>
                    <span th:case="*">📍</span>
                </span>
            </div>
            <!-- 节点信息 -->
            <div class="campus-node__body">
                <h2 class="campus-node__name" th:text="${location.locationName}">地点名</h2>
                <p class="campus-node__vibe" th:text="${location.description}">氛围短句</p>
                <!-- 传闻标记 -->
                <span th:if="${rumorCountsByLocation != null and rumorCountsByLocation[location.id] != null}"
                      class="campus-node__badge campus-node__badge--rumor">有传闻</span>
                <!-- 探索度 -->
                <div class="campus-node__explore">
                    <div class="campus-node__explore-track">
                        <div class="campus-node__explore-fill"
                             th:style="'width:' + ${exploreLevels[location.id] != null ? exploreLevels[location.id] : 0} + '%; background:' + ${location.themeColor}"></div>
                    </div>
                    <span class="campus-node__explore-label"
                          th:text="'探索 ' + ${exploreLevels[location.id] != null ? exploreLevels[location.id] : 0} + '%'">0%</span>
                </div>
                <!-- 行动点消耗 -->
                <div class="campus-node__cost">
                    <span class="campus-node__ap">⚡ 1 行动点</span>
                </div>
            </div>
            <!-- 行动按钮 -->
            <a class="campus-node__go"
               th:if="${profile.actionPoints > 0}"
               th:href="@{/map/location/{id}/event(id=${location.id})}">去这里</a>
            <span class="campus-node__go campus-node__go--disabled"
                  th:if="${profile.actionPoints == 0}">行动点不足</span>
        </article>
    </section>

    <!-- ========== 学期结束 ========== -->
    <section th:if="${semesterOver}" class="campus-map__end">
        <p>学期已结束，无法继续行动。</p>
        <a href="/ending" class="sticky-note__btn sticky-note__btn--primary">📖 查看学期回忆</a>
    </section>

    <!-- ========== 副本入口 ========== -->
    <aside class="campus-map__dungeon-hook" th:if="${!semesterOver}">
        <div class="campus-map__dungeon-hook-left">
            <span class="campus-map__dungeon-hook-tag">核心副本</span>
            <h3>Java 课设：DDL 前夜</h3>
            <p>实验室灯还亮着，数据库关系还没想清楚。</p>
        </div>
        <a href="/dungeons" class="sticky-note__btn sticky-note__btn--primary">⚔️ 查看副本</a>
    </aside>

    <!-- ========== 返回寝室 ========== -->
    <div class="campus-map__back" th:if="${!semesterOver}">
        <a href="/dashboard" class="sticky-note__btn">🏠 回寝室</a>
        <a href="/exploration" class="sticky-note__btn">🔍 去踩点</a>
    </div>

</main>

<!-- 手机底栏 -->
<div th:replace="~{fragments/layout :: game-dock}"></div>

</body>
</html>
