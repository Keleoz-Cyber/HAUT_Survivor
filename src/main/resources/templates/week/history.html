<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史周报 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/scribble.css">
</head>
<body>

<header th:replace="~{fragments/layout :: game-hud}"></header>

<main class="dorm-room week-summary-page week-history-page">

    <!-- ===== 标题 ===== -->
    <section class="week-history-title">
        <h1 class="handwrite">📚 历史周报</h1>
        <p class="week-history-title__desc">
            传闻、周主题、搭子和奇遇带来的变化都会在这里按周回放。
        </p>
    </section>

    <!-- ===== 学期档案卡 ===== -->
    <section class="paper-card tilt-left semester-archive"
             th:if="${archiveSummary != null}">
        <div class="semester-archive__head">
            <p class="semester-archive__eyebrow">学期档案</p>
            <h2 class="handwrite semester-archive__title"
                th:text="${archiveSummary.growthKeyword}">探索新生</h2>
        </div>

        <div class="semester-archive__keywords">
            <span class="paper-chip paper-chip--purple"
                  th:text="${archiveSummary.growthKeyword}">探索新生</span>
            <span class="paper-chip"
                  th:text="${archiveSummary.mainSourceLabel}">校园影响</span>
        </div>

        <p class="semester-archive__desc"
           th:text="${archiveSummary.growthDescription}">
            这个学期的档案刚刚展开，去探索、互动或推进周次后，会留下更具体的成长记录。
        </p>

        <div class="semester-archive__stats">
            <span class="paper-chip paper-chip--green">
                正向 <strong th:text="${archiveSummary.positiveCount}">0</strong>
            </span>
            <span class="paper-chip paper-chip--blue">
                中性 <strong th:text="${archiveSummary.neutralCount}">0</strong>
            </span>
            <span class="paper-chip paper-chip--pink">
                压力 <strong th:text="${archiveSummary.negativeCount}">0</strong>
            </span>
        </div>

        <div class="semester-archive__snapshot">
            <span class="paper-chip paper-chip--yellow">
                关键周 ·
                <strong th:text="${archiveSummary.keyWeekNumber != null ? '第 ' + archiveSummary.keyWeekNumber + ' 周' : '尚未形成'}">尚未形成</strong>
            </span>
            <span class="paper-chip paper-chip--orange">
                关键关系 ·
                <strong th:text="${archiveSummary.keyNpcName != null ? archiveSummary.keyNpcName + ' · ' + archiveSummary.keyNpcStage : '暂无'}">暂无</strong>
            </span>
        </div>

        <div class="semester-archive__highlights"
             th:if="${archiveSummary.highlights != null and !archiveSummary.highlights.isEmpty()}">
            <p class="semester-archive__highlights-title">📝 学期亮点</p>
            <ul class="semester-archive__highlights-list">
                <li class="semester-archive__highlight"
                    th:each="highlight : ${archiveSummary.highlights}">
                    <span class="paper-chip paper-chip--white" th:text="${highlight.label}">成长</span>
                    <strong th:text="${highlight.title}">探索新生</strong>
                    <span class="semester-archive__highlight-desc" th:text="${highlight.description}">档案说明</span>
                </li>
            </ul>
        </div>
    </section>

    <!-- ===== 空态 ===== -->
    <section class="paper-card week-history-empty"
             th:if="${historyWeeks == null or historyWeeks.isEmpty()}">
        <p class="handwrite week-summary-card__title">还没有可复盘的影响</p>
        <p class="week-summary-memory__none">
            去校园里踩点、触发传闻或推进奇遇后，这里会慢慢变成你的周报档案。
        </p>
    </section>

    <!-- ===== 每周档案卡（堆叠交错倾斜） ===== -->
    <section class="week-history-list"
             th:if="${historyWeeks != null and !historyWeeks.isEmpty()}">
        <article class="paper-card week-history-week"
                 th:each="week : ${historyWeeks}">
            <div class="week-history-week__head">
                <p class="handwrite week-history-week__num"
                   th:text="'第 ' + ${week.weekNumber} + ' 周'">第 2 周</p>
                <span class="paper-chip paper-chip--blue week-history-week__count"
                      th:text="${week.entries.size()} + ' 条影响'">2 条影响</span>
            </div>

            <ul class="week-history-week__entries">
                <li class="week-history-week__entry"
                    th:each="impact : ${week.entries}">
                    <span class="paper-chip" th:text="${impact.sourceLabel}">校园传闻</span>
                    <strong class="week-history-week__entry-name"
                            th:text="${impact.sourceName != null and !impact.sourceName.isBlank() ? impact.sourceName : '校园影响'}">校园影响</strong>
                    <span class="week-history-week__entry-desc"
                          th:text="${impact.description}">影响说明</span>
                    <span class="paper-chip paper-chip--green week-history-week__entry-change"
                          th:text="${impact.changeText}">社交 +1</span>
                </li>
            </ul>
        </article>
    </section>

    <!-- ===== 操作区 ===== -->
    <section class="week-summary-actions week-history-actions">
        <a href="/week/summary" class="paper-btn paper-btn--primary">📖 回到本周总结</a>
        <a href="/dashboard" class="paper-btn">🏠 回寝室</a>
    </section>
</main>

<nav th:replace="~{fragments/layout :: game-dock}"></nav>

</body>
</html>
