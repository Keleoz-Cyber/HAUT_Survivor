<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>任务管理 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container app-shell" style="max-width: 960px; padding: 0 16px 100px;">
    <header style="margin-bottom: 20px;">
        <h1 class="handwrite" style="font-size: 2rem; margin: 0;">任务管理</h1>
        <p style="color: var(--ink-muted); margin: 4px 0 0;">把要做的事写在小纸条上</p>
    </header>

    <section class="paper-card tilt-right" style="margin-bottom: 18px;">
        <h2 class="handwrite" style="font-size: 1.3rem; margin: 0 0 12px;">创建任务</h2>
        <div th:if="${error}" class="paper-chip paper-chip--pink" style="display: block; margin-bottom: 12px; padding: 8px 12px;" th:text="${error}"></div>
        <form method="post" action="/tasks" style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px;">
            <div style="grid-column: span 12;">
                <label for="taskName" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">任务名称</label>
                <input id="taskName" name="taskName" class="paper-input" th:value="${taskName}" required>
            </div>
            <div style="grid-column: span 6;">
                <label for="taskType" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">任务类型</label>
                <input id="taskType" name="taskType" class="paper-input" th:value="${taskType}" placeholder="课程" required>
            </div>
            <div style="grid-column: span 6;">
                <label for="difficulty" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">难度</label>
                <select id="difficulty" name="difficulty" class="paper-input" required>
                    <option th:each="item : ${difficulties}" th:value="${item}" th:text="${item}" th:selected="${item == difficulty}"></option>
                </select>
            </div>
            <div style="grid-column: span 12;">
                <label for="deadline" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">截止时间</label>
                <input id="deadline" name="deadline" type="datetime-local" class="paper-input">
            </div>
            <div style="grid-column: span 12;">
                <label for="description" style="font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 4px;">描述</label>
                <textarea id="description" name="description" class="paper-input" rows="2" th:text="${description}"></textarea>
            </div>
            <div style="grid-column: span 12;">
                <button type="submit" class="paper-btn paper-btn--primary">创建任务</button>
            </div>
        </form>
    </section>

    <section class="paper-card">
        <h2 class="handwrite" style="font-size: 1.3rem; margin: 0 0 12px;">我的任务</h2>
        <div th:if="${tasks.isEmpty()}" style="color: var(--ink-muted); font-style: italic;">暂无任务。</div>
        <div th:unless="${tasks.isEmpty()}" style="overflow-x: auto;">
            <table class="paper-table">
                <thead>
                <tr>
                    <th>任务</th>
                    <th>类型</th>
                    <th>难度</th>
                    <th>奖励</th>
                    <th>状态</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${tasks}">
                    <td>
                        <strong th:text="${task.taskName}" style="font-size: 0.95rem;">任务</strong>
                        <div style="color: var(--ink-muted); font-size: 0.8rem; margin-top: 2px;" th:text="${task.description}">描述</div>
                    </td>
                    <td>
                        <span class="paper-chip paper-chip--blue" th:text="${task.taskType}">课程</span>
                    </td>
                    <td>
                        <span class="paper-chip paper-chip--purple" th:text="${task.difficulty}">A</span>
                    </td>
                    <td th:text="${task.rewardExp}" style="font-weight: 800;">70</td>
                    <td>
                        <span class="paper-chip"
                              th:classappend="${task.status == 'DONE'} ? ' paper-chip--green' : ' paper-chip--yellow'"
                              th:text="${task.status}">PENDING</span>
                    </td>
                    <td style="text-align: right;">
                        <form th:if="${task.status != 'DONE'}" method="post" th:action="@{/tasks/{id}/complete(id=${task.id})}" style="display: inline;">
                            <button type="submit" class="paper-btn paper-btn--success" style="font-size: 0.8rem; padding: 4px 12px;">完成</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
