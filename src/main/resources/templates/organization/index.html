<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>社团招新广场 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <link href="/css/scribble.css" rel="stylesheet">
    <style>
        .org-plaza { max-width: 960px; margin: 0 auto; padding: 0 16px 100px; }
        .org-plaza__sub { color: var(--ink-muted); font-size: 0.95rem; margin: 6px 0 0; line-height: 1.6; }
        .org-plaza__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .org-plaza__grid .paper-card:nth-child(odd)  { transform: rotate(-0.3deg); }
        .org-plaza__grid .paper-card:nth-child(even) { transform: rotate(0.3deg); }
        .org-plaza__grid .paper-card:nth-child(odd):hover,
        .org-plaza__grid .paper-card:nth-child(even):hover { transform: translate(-2px, -2px) rotate(0deg); }
        .org-booth__icon { font-size: 2rem; line-height: 1; }
        .org-booth__body h2 { margin: 4px 0; }
        .org-booth__type { margin: 4px 0; }
        .org-booth__desc { color: var(--ink-muted); font-size: 0.9rem; margin: 4px 0 8px; line-height: 1.55; }
        .org-booth__attr { margin: 4px 0; }
        .org-booth__status { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
        .org-booth__body .paper-btn { margin-top: 6px; }
        @media (max-width: 640px) { .org-plaza__grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<!-- 游戏HUD -->
<div th:replace="~{fragments/layout :: game-hud}"></div>

<main class="org-plaza">

    <!-- ========== 标题区 ========== -->
    <section class="paper-card tilt-left">
        <p class="handwrite">🎉 社团招新广场</p>
        <h1 class="handwrite">今天想加入哪个圈子？</h1>
        <p class="org-plaza__sub">组织能带来社交、声望和独特路线，但也会占用你的时间。加入需要社交值 ≥ 40。</p>
    </section>

    <div th:if="${semesterOver}" class="paper-card tilt-right" style="background: var(--yellow-light);">学期已结束，无法继续组织活动。</div>

    <!-- ========== 摊位网格 ========== -->
    <section class="org-plaza__grid" th:if="${!semesterOver}">
        <article class="paper-card org-booth" th:each="org : ${orgs}" th:style="|--booth-color: ${org.themeColor}">
            <div class="org-booth__icon">
                <span th:switch="${org.orgType}">
                    <span th:case="'学生会'">🏛️</span>
                    <span th:case="'实验室项目组'">🔬</span>
                    <span th:case="'篮球社'">🏀</span>
                    <span th:case="*">🎪</span>
                </span>
            </div>
            <div class="org-booth__body">
                <h2 class="handwrite" th:text="${org.orgName}">组织名</h2>
                <p class="org-booth__type">
                    <span class="paper-chip"
                          th:classappend="${org.orgType == '学生组织'} ? 'paper-chip--blue' : (${org.orgType == '技术社团'} ? 'paper-chip--purple' : (${org.orgType == '兴趣社团'} ? 'paper-chip--green' : (${org.orgType == '竞赛队'} ? 'paper-chip--orange' : (${org.orgType == '文艺社团'} ? 'paper-chip--pink' : 'paper-chip--yellow'))))"
                          th:text="${org.orgType}">类型</span>
                </p>
                <p class="org-booth__desc" th:text="${org.description}">描述</p>
                <p class="org-booth__attr" th:if="${org.recommendedAttribute}">
                    <span class="paper-chip paper-chip--white" th:text="'推荐属性：' + ${org.recommendedAttribute}">推荐属性</span>
                </p>
                <div class="org-booth__status" th:with="rel=${relationMap.get(org.id)}">
                    <span th:if="${rel == null}" class="paper-chip paper-chip--white">🔒 未发现</span>
                    <span th:if="${rel != null and rel.membershipStatus == 'discovered'}" class="paper-chip paper-chip--blue">🔓 已发现</span>
                    <span th:if="${rel != null and (rel.membershipStatus == 'member' or rel.membershipStatus == 'core_member')}" class="paper-chip paper-chip--green"
                          th:text="${rel.positionName} + ' · 贡献 ' + ${rel.contribution} + ' · 声望 ' + ${rel.reputation}">成员</span>
                </div>
                <a th:if="${!semesterOver}" th:href="@{/organizations/{id}(id=${org.id})}" class="paper-btn">去摊位看看</a>
            </div>
        </article>
    </section>

    <div class="sticky-note__actions" th:if="${!semesterOver}">
        <a href="/map" class="paper-btn">🗺️ 回地图</a>
        <a href="/dashboard" class="paper-btn">🏠 回寝室</a>
    </div>

</main>

<!-- 手机底栏 -->
<div th:replace="~{fragments/layout :: game-dock}"></div>

</body>
</html>
