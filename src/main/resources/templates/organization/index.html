<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>校园组织 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="survivor-body">
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container app-shell">
    <header class="campus-hero mb-4">
        <div>
            <p class="campus-hero__eyebrow">校园组织</p>
            <h1 class="campus-hero__title">加入你的路线</h1>
            <p class="campus-hero__copy">组织能带来社交、声望和独特路线，但也会占用你的时间。</p>
        </div>
        <div class="campus-status">
            <span th:text="|行动点 ${profile.actionPoints}/${profile.maxActionPoints}|">4/4</span>
            <span th:text="|第 ${profile.currentWeek} 周|">第 1 周</span>
        </div>
    </header>

    <div th:if="${semesterOver}" class="alert alert-info">学期已结束。</div>

    <section class="row g-3">
        <article class="col-md-6" th:each="org : ${orgs}">
            <div class="panel" th:style="--border-color: ${org.themeColor}; border-left: 4px solid var(--border-color)">
                <h3 class="h5" th:text="${org.orgName}">组织名</h3>
                <p class="text-muted mb-2">
                    <span class="badge" th:style="'background:' + ${org.themeColor}" th:text="${org.orgType}">类型</span>
                </p>
                <p th:text="${org.description}">描述</p>
                <p class="mb-2">
                    <span class="text-muted" th:if="${org.recommendedAttribute}"
                          th:text="'推荐属性：' + ${org.recommendedAttribute}">推荐属性</span>
                </p>
                <div th:with="rel=${relations.stream().filter(r -> r.organizationId == org.id).findFirst().orElse(null)}">
                    <span th:if="${rel == null}" class="badge bg-secondary">未发现</span>
                    <span th:if="${rel != null and rel.membershipStatus == 'discovered'}" class="badge bg-info">已发现</span>
                    <span th:if="${rel != null and rel.membershipStatus == 'member'}" class="badge bg-success"
                          th:text="${rel.positionName} + ' · 贡献 ' + ${rel.contribution}">成员</span>
                    <span th:if="${rel != null and rel.membershipStatus == 'core_member'}" class="badge bg-warning text-dark"
                          th:text="${rel.positionName} + ' · 贡献 ' + ${rel.contribution}">骨干</span>
                    <a th:if="${!semesterOver}" th:href="@{/organizations/{id}(id=${org.id})}" class="btn btn-sm btn-outline-light ms-2">查看</a>
                </div>
            </div>
        </article>
    </section>
</main>
</body>
</html>
