<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>组织活动 - HAUT Survivor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <link href="/css/scribble.css" rel="stylesheet">
</head>
<body>

<!-- 游戏HUD -->
<div th:replace="~{fragments/layout :: game-hud}"></div>

<main class="vn-stage" th:style="|--booth-color: ${org.themeColor}">
    <div class="vn-result">

        <!-- 标题区 -->
        <div class="vn-result__header">
            <div class="vn-result__meta">
                <span class="paper-chip paper-chip--yellow" th:text="${org.orgType}">类型</span>
                <span class="paper-chip paper-chip--white" th:text="${org.orgName}">组织名</span>
            </div>
            <h1 class="vn-result__title handwrite" th:text="${org.orgName}">组织名</h1>
        </div>

        <!-- 氛围描述 -->
        <p class="vn-result__story" th:text="${org.description}">描述</p>

        <!-- 错误提示 -->
        <div th:if="${error}" class="paper-card tilt-right" style="background: var(--pink-light); padding: 10px 14px;" th:text="${error}">错误</div>

        <!-- 活动属性变化 -->
        <div th:if="${activityChange != null and activityChange.hasAnyChange()}" class="vn-result__changes">
            <p class="vn-result__changes-label">本次活动</p>
            <p th:if="${activityResultText}" class="vn-result__story" style="margin-bottom:8px;" th:text="${activityResultText}">活动描述</p>
            <div class="vn-result__changes-list">
                <span th:if="${activityChange.academicChange != 0}" class="vn-result__change paper-chip" th:classappend="${activityChange.academicChange > 0} ? 'paper-chip--green' : 'paper-chip--pink'">📚 学业 <em th:text="${activityChange.academicChange > 0} ? '+' + ${activityChange.academicChange} : ${activityChange.academicChange}">+5</em><small th:text="'（' + ${attribute.academic} + ')'"></small></span>
                <span th:if="${activityChange.healthChange != 0}" class="vn-result__change paper-chip" th:classappend="${activityChange.healthChange > 0} ? 'paper-chip--green' : 'paper-chip--pink'">💚 健康 <em th:text="${activityChange.healthChange > 0} ? '+' + ${activityChange.healthChange} : ${activityChange.healthChange}">+5</em><small th:text="'（' + ${attribute.health} + ')'"></small></span>
                <span th:if="${activityChange.socialChange != 0}" class="vn-result__change paper-chip" th:classappend="${activityChange.socialChange > 0} ? 'paper-chip--green' : 'paper-chip--pink'">🤝 社交 <em th:text="${activityChange.socialChange > 0} ? '+' + ${activityChange.socialChange} : ${activityChange.socialChange}">+3</em><small th:text="'（' + ${attribute.social} + ')'"></small></span>
                <span th:if="${activityChange.skillChange != 0}" class="vn-result__change paper-chip" th:classappend="${activityChange.skillChange > 0} ? 'paper-chip--green' : 'paper-chip--pink'">🔧 技能 <em th:text="${activityChange.skillChange > 0} ? '+' + ${activityChange.skillChange} : ${activityChange.skillChange}">+5</em><small th:text="'（' + ${attribute.skill} + ')'"></small></span>
                <span th:if="${activityChange.pressureChange != 0}" class="vn-result__change paper-chip" th:classappend="${activityChange.pressureChange > 0} ? 'paper-chip--pink' : 'paper-chip--green'">😰 压力 <em th:text="${activityChange.pressureChange > 0} ? '+' + ${activityChange.pressureChange} : ${activityChange.pressureChange}">+2</em><small th:text="'（' + ${attribute.pressure} + ')'"></small></span>
                <span th:if="${activityChange.disciplineChange != 0}" class="vn-result__change paper-chip" th:classappend="${activityChange.disciplineChange > 0} ? 'paper-chip--green' : 'paper-chip--pink'">🎯 自律 <em th:text="${activityChange.disciplineChange > 0} ? '+' + ${activityChange.disciplineChange} : ${activityChange.disciplineChange}">+1</em><small th:text="'（' + ${attribute.discipline} + ')'"></small></span>
            </div>
        </div>

        <!-- 角色状态小条 -->
        <div class="vn-result__stats">
            <span class="paper-chip paper-chip--pink">社交 <strong th:text="${attribute.social}">50</strong></span>
            <span class="paper-chip paper-chip--blue">自律 <strong th:text="${attribute.discipline}">50</strong></span>
            <span class="paper-chip paper-chip--orange">压力 <strong th:text="${attribute.pressure}">30</strong></span>
            <span class="paper-chip paper-chip--yellow">行动点 <strong th:text="${profile.actionPoints}">4</strong></span>
        </div>

        <!-- ===== 未发现 ===== -->
        <div th:if="${relation == null}" class="vn-result__changes">
            <div th:if="${!exploreUnlocked}" class="paper-card tilt-left" style="background: var(--orange-light); padding: 10px 14px;">
                🔒 探索度不足！需要先去探索对应地点，达到 <span th:text="${org.unlockExploreLevel}">20</span>% 探索度才能发现此组织。
            </div>
            <form method="post" th:action="@{/organizations/{id}/discover(id=${org.id})}">
                <button type="submit" class="paper-btn paper-btn--primary"
                        th:classappend="${!exploreUnlocked or semesterOver} ? 'paper-btn--disabled'"
                        th:disabled="${!exploreUnlocked or semesterOver}">🔍 发现这个组织</button>
            </form>
        </div>

        <!-- ===== 已发现未加入 ===== -->
        <div th:if="${relation != null and relation.membershipStatus == 'discovered'}" class="vn-result__changes">
            <p class="vn-result__story" style="color: var(--ink-muted); margin-bottom:12px;">你已经发现了 <span th:text="${org.orgName}">组织</span>。加入需要社交值 ≥ 40。</p>
            <form method="post" th:action="@{/organizations/{id}/join(id=${org.id})}">
                <button type="submit" class="paper-btn paper-btn--primary"
                        th:disabled="${semesterOver or attribute.social < 40}">✋ 申请加入</button>
            </form>
            <span th:if="${attribute.social < 40}" class="paper-chip paper-chip--orange" style="margin-top:8px;">社交不足，多参加社交活动吧！</span>
        </div>

        <!-- ===== 已加入 ===== -->
        <div th:if="${relation != null and (relation.membershipStatus == 'member' or relation.membershipStatus == 'core_member')}" class="vn-result__changes">
            <div class="org-stage__position" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom: 8px;">
                <span class="paper-chip paper-chip--green" th:text="${relation.positionName}">职位</span>
                <span class="paper-chip paper-chip--white" th:text="'贡献 ' + ${relation.contribution}">贡献 0</span>
                <span class="paper-chip paper-chip--white" th:text="'声望 ' + ${relation.reputation}">声望 0</span>
            </div>
            <p class="vn-result__story" style="color: var(--ink-muted); font-size:0.85rem; margin-bottom:12px;">参加活动消耗 1 行动点。贡献 ≥ 10 自动晋升为部长。</p>
            <form method="post" th:action="@{/organizations/{id}/activity(id=${org.id})}">
                <button type="submit" class="paper-btn paper-btn--success"
                        th:disabled="${semesterOver or profile.actionPoints <= 0}">🎉 参加本周活动</button>
            </form>
            <span th:if="${profile.actionPoints <= 0 and !semesterOver}" class="paper-chip paper-chip--orange" style="margin-top:8px;">⚡ 行动点不足</span>
        </div>

        <!-- 导航 -->
        <div class="vn-result__actions">
            <a href="/organizations" class="paper-btn">🎪 返回社团广场</a>
            <a href="/map" class="paper-btn">🗺️ 回地图</a>
        </div>

    </div>
</main>

<!-- 手机底栏 -->
<div th:replace="~{fragments/layout :: game-dock}"></div>

</body>
</html>
