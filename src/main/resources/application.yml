spring:
  application:
    name: HAUT Survivor
  datasource:
    url: jdbc:mysql://localhost:3306/haut_survivor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql,classpath:data-content-pack-2.sql,classpath:data-content-pack-3.sql,classpath:data-content-pack-4.sql,classpath:data-content-pack-6.sql
  thymeleaf:
    cache: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
